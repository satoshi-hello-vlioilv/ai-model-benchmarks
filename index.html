<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIモデル比較ダッシュボード</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Erect%7Bfill:%231a1a19%7Dpath%7Bstroke:%23fcfcfb%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23f2f1ec%7Dpath%7Bstroke:%231a1a19%7D%7D%3C/style%3E%3Crect width='32' height='32' rx='8'/%3E%3Cpath d='M7 25v-7M13 25V10M19 25V14M25 25V6' fill='none' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="主要AIモデルの性能・価格・速度・仕様を1画面で比較するダッシュボード。データはJSONで差し替え・追記可能。">
<style>
/* ============================================================
   Design tokens — 色は役割（ロール）で参照し、ライト／ダークを一箇所で切替える
   系列色は提供元（エンティティ）に固定。順位では塗り替えない。
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f3f2ef; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e7e5e0;
  --border:#e1dfd9; --border-strong:#cfccc4;
  --text:#1a1a19; --text-2:#4a4945; --muted:#68675f;
  --ink:#1a1a19; --ink-text:#fcfcfb;           /* 選択状態（系列色と衝突しない無彩色） */
  --grid:#e9e7e2; --axis:#bdbab2;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --bar:color-mix(in oklab,#1c5cab 17%,transparent);
  --seq-lo:#f0efec; --seq-hi:#1c5cab;          /* 逐次（ヒートマップ）＝青1色相 */
  --c-other:#8a8983;
  --good:#0ca30c; --good-text:#1d7a2e; --warning:#fab219; --critical:#d03b3b;
  --shadow:0 1px 2px rgba(20,20,18,.05),0 4px 16px rgba(20,20,18,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
    --border:#30302c; --border-strong:#44443f;
    --text:#f2f1ec; --text-2:#cbcac0; --muted:#a3a29a; --good-text:#5fd17a;
    --ink:#f2f1ec; --ink-text:#1a1a19;
    --grid:#2a2a27; --axis:#4a4a45;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --seq-lo:#232321; --seq-hi:#5598e7; --c-other:#9a9990; --bar:color-mix(in oklab,#5598e7 28%,transparent);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
  --border:#30302c; --border-strong:#44443f;
  --text:#f2f1ec; --text-2:#cbcac0; --muted:#a3a29a; --good-text:#5fd17a;
  --ink:#f2f1ec; --ink-text:#1a1a19;
  --grid:#2a2a27; --axis:#4a4a45;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --seq-lo:#232321; --seq-hi:#5598e7; --c-other:#9a9990; --bar:color-mix(in oklab,#5598e7 28%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}

/* ============================== Base ============================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
body{word-break:auto-phrase;text-wrap:pretty;font:13px/1.5 "Segoe UI","Yu Gothic UI","Meiryo UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
a{color:inherit;text-underline-offset:2px}

/* ============================== Shell (スクロールレス) ============================== */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);height:100vh;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:184px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px;stroke:var(--ink-text)}
.brand b{font-size:14px;letter-spacing:.01em;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:11px}
.filters{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.filters .lbl{color:var(--muted);font-size:11px;margin-right:2px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);white-space:nowrap;font-size:12px;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.chip[aria-pressed="false"] .sw{opacity:.25}
.chip.toggle[aria-pressed="true"]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.chip.toggle::before{content:"";width:12px;height:12px;border-radius:3px;border:1.5px solid currentColor;flex:none;box-sizing:border-box}
.chip.toggle[aria-pressed="true"]::before{content:"✓";border:0;font-size:12px;line-height:12px;text-align:center;font-weight:700}
.chip[data-prov][aria-pressed="false"]{color:var(--muted);text-decoration:line-through;border-style:dashed}
.reset{border:0;background:none;color:var(--text);font-size:11.5px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;padding:0 2px;cursor:pointer}
.sw{width:9px;height:9px;border-radius:50%;flex:none}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.top-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--surface-2);color:var(--text-2);font-size:11.5px;white-space:nowrap}
.badge.warn{background:color-mix(in oklab,var(--warning) 22%,var(--surface));color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.badge.warn .dot{background:var(--warning)}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn svg{width:16px;height:16px}

.rail{background:var(--surface);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.nav-item{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--text-2);position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.nav-item svg{width:18px;height:18px}
.nav-item small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.3;white-space:nowrap}
.nav-sep{height:1px;background:var(--border);margin:5px 10px;flex:none}
.nav-item > span{min-width:0}
.nav-item kbd{font:11px/1 inherit;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.6}
.rail-foot b{color:var(--text-2);font-weight:600}

main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;padding:12px 16px 14px;min-height:0;min-width:0}
.subbar{display:flex;align-items:center;gap:12px;min-height:34px;min-width:0}
.subbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.subbar .lead{color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;min-width:0}
.subbar .lead b{font-weight:700}
.subbar .concl{display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding-left:12px;border-left:2px solid var(--ink)}
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:9px;margin-left:auto;flex:none}
.tab{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--text-2);font-size:12.5px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.tab .n{color:var(--muted);font-weight:400;margin-left:4px;font-size:11px}

.view{min-height:0;min-width:0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;min-width:0}
.card-h h2{font-size:13.5px;margin:0;font-weight:650;white-space:nowrap}
.card-h .sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.body{flex:1;min-height:0;min-width:0;position:relative}
.chart{position:absolute;inset:0}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.caveat{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.caveat::before{content:"!";flex:none;width:15px;height:15px;border-radius:50%;border:1px solid var(--border-strong);font-size:10.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);font-size:10.5px;color:var(--muted);cursor:help;flex:none}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px;text-align:center;padding:10px}

/* SVG text */
.ax{font-size:11px;fill:var(--muted)}
.lb{font-size:12px;fill:var(--text)}
.lb2{font-size:11px;fill:var(--text-2)}
/* 点ラベル・軸ラベルの縁取り（線や点の上でも読める） */
svg .lb2, svg .ax, svg .halo, svg .vl, svg .lb{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.vl{font-size:11.5px;fill:var(--text);font-variant-numeric:tabular-nums}
.vl.top{font-weight:700}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.hit{fill:transparent;cursor:pointer}
.hit:hover + .mk, .mk:hover{filter:brightness(1.08)}
[data-m]{cursor:pointer}
.row-hover{fill:var(--surface-2);opacity:0}
g.r:hover .row-hover{opacity:1}

/* ============================== KPI / lists ============================== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:12px 14px 11px}
.kpi .k-l{font-size:11.5px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.kpi .k-v{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.kpi .k-v b{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.kpi .k-v span{font-size:12px;color:var(--muted)}
.kpi .k-m{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:4px;cursor:pointer}
.kpi .k-d{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mname{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.mname .sw{width:8px;height:8px}
.mname span{overflow:hidden;text-overflow:ellipsis}
.mname > span:first-of-type + span, .mname > span:nth-child(2){text-decoration:underline dotted;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.mname:hover > span:nth-child(2){text-decoration:underline solid;text-decoration-color:currentColor}
span.bn[data-gb], .tag[data-gb]{text-decoration:underline dotted;text-decoration-color:var(--border-strong);text-underline-offset:3px}
span.bn[data-gb]:hover{text-decoration:underline solid}
svg .ul{stroke:var(--axis);stroke-dasharray:1.5 2.5;stroke-width:1.2}
g[data-m]:hover .ul{stroke:var(--text);stroke-dasharray:none}
.go{border:0;background:none;padding:0;color:var(--text);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border-strong);white-space:nowrap;cursor:pointer}
.go::after{content:" ›"}
.go:hover{text-decoration-color:currentColor}
.chev{color:var(--muted);text-align:right;width:18px}
tr[data-prof]:hover .chev, .li:hover .chev{color:var(--text)}

table{border-collapse:collapse;width:100%}
.tbl{font-size:12px}
.tbl th{font-weight:600;color:var(--text-2);text-align:left;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1}
.tbl.fit th{white-space:normal;line-height:1.25;vertical-align:bottom}
.tbl.fit td{overflow:hidden;text-overflow:ellipsis}
.tbl td{padding:0 8px;height:var(--rh,30px);border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl.dense{font-size:11.5px}
.tbl.dense th{padding:4px 6px;font-size:11px}
.tbl.dense td{padding:0 6px;line-height:1.2}
.tbl.dense .lim{padding:1px 3px;font-size:10.5px}
.gantt{display:grid;gap:1px}
.gantt .li,.gantt .gh{display:grid;grid-template-columns:minmax(0,1fr) 42%;gap:8px;align-items:center;min-height:21px;padding:1px 6px;font-size:11.5px}
.gantt .gn{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.25;text-align:left;white-space:normal;overflow:visible}
.gantt .gn .sw{flex:none}
.gantt .li > span:first-child{white-space:normal;overflow:visible;text-overflow:clip}
.gtrack{position:relative;height:12px;display:block}
.gtrack::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--grid)}
.gaxis{height:14px}.gaxis::before{display:none}
.gaxis span{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.gaxis .gnow{color:var(--text);font-weight:650}
.gb{position:absolute;top:1px;bottom:1px;border-radius:3px;min-width:4px}
.gb.solid{background:var(--c)}
.gb.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1.5px var(--c)}
.gb.outline{border:1.5px dashed var(--c)}
.gt{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--text);opacity:.7}
.ulist .li{min-height:22px;padding:2px 6px;font-size:11.5px}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th .arr{color:var(--muted);font-size:10.5px;margin-left:3px}
.tbl .grp td{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:11px;height:24px;letter-spacing:.04em}
.best{font-weight:700}
.best::after{content:"★";font-size:10.5px;margin-left:3px;color:var(--text-2);vertical-align:1px}
.na{color:var(--muted)}

.podium{table-layout:fixed}
.podium .lim{display:none}
.podium td{font-size:11.5px}
.podium td{height:var(--rh,30px);overflow:hidden;padding-top:1px;padding-bottom:1px;line-height:1.3}
.pc{display:flex;align-items:center;min-width:0}
.pc .mname{flex:0 1 auto}
.podium .rk{font-size:11px;color:var(--muted);margin-right:4px}
.podium .v{font-variant-numeric:tabular-nums;color:var(--text-2);margin-left:6px;font-size:11.5px;flex:none}
.podium .bn,.podium .cat{overflow:hidden;text-overflow:ellipsis}
.podium td.c1 .v{color:var(--text);font-weight:700}
.podium .bn{font-weight:600}
.podium .cat{display:block;color:var(--muted);font-size:10.5px;font-weight:400;line-height:1.2}

.recs{display:grid;gap:0;align-content:start}
.rec{display:grid;grid-template-columns:22px minmax(0,9.2em) minmax(0,1fr) auto;gap:10px;align-items:center;height:var(--rh,56px);padding:0 4px;border-bottom:1px solid var(--grid)}
.rec .wl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.rec .wl b{font-size:13px}
.rec .wr{display:flex;align-items:center;gap:10px;margin-top:1px}
.rec .wr .why{margin:0;flex:none}
.rec .wr .lanew{flex:1}
.recs.tall .wr{flex-direction:column;align-items:stretch;gap:2px}
.recs.tall .wr .why{margin-top:1px}
.recs.tall .lane{height:26px}
/* アイコン */
.ico{display:inline-flex;flex:none;color:var(--text-2)}
.ico svg{width:15px;height:15px}
.ico.lg{width:22px;height:22px;border-radius:6px;background:var(--surface-2);align-items:center;justify-content:center;color:var(--text)}
.ico.lg svg{width:15px;height:15px}
.ico.sm svg{width:11px;height:11px}
.ico.sm{margin-right:3px;vertical-align:-1px}
/* ドットレーン（共通部品） */
.lanew{display:flex;align-items:center;gap:8px;min-width:0}
.lane{position:relative;flex:1;height:22px;min-width:60px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--grid);border-radius:1px}
.ld{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--border-strong);cursor:pointer}
.ld.rk{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;color:#fff;font-weight:700;font-size:10px;line-height:15px;text-align:center;box-shadow:0 0 0 1.5px var(--surface);text-shadow:0 0 2px rgba(0,0,0,.55)}
.ld.grp{display:flex;gap:1px;width:auto;height:15px;margin:-7.5px 0 0 0;transform:translateX(-50%);background:var(--surface);border-radius:8px;box-shadow:0 0 0 1.5px var(--surface);z-index:1}
.ld.grp b{display:block;min-width:15px;height:15px;border-radius:8px;color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center;text-shadow:0 0 2px rgba(0,0,0,.55);cursor:pointer}
.ld.grp b:hover{outline:2px solid var(--text);outline-offset:1px}
.ld:hover{outline:2px solid var(--text);outline-offset:1px}
.le{font-size:11px;color:var(--text-2);flex:none}
.kpi .k-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:end}
.kpi .k-row .lanew{margin-bottom:4px}
.kpi .k-row.hist{grid-template-columns:minmax(0,1fr) 38%}
.fv{min-width:0;width:100%}
.fv-e{display:flex;gap:1px;height:14px;margin:8px 0 2px}
.fv-e i{display:block;border-radius:2px;background:var(--axis)}
.fv-e i.boom{background:var(--seq-hi)}
.fv-e i.w{background:repeating-linear-gradient(135deg,var(--text-2) 0 1.5px,transparent 1.5px 4px)}
.fv-a{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.podium .p1 .pc{font-weight:600}
.podium .p23{display:flex;gap:14px;margin-top:2px;color:var(--text-2);overflow:hidden}
.podium .p23 .pc{font-size:11px}
.podium .pc{display:inline-flex;align-items:baseline;min-width:0;white-space:nowrap}
.rec .u{font-size:12.5px;color:var(--text);font-weight:600;line-height:1.35;word-break:keep-all}
.rec .u small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.rec .why{font-size:11.5px;color:var(--text-2);margin-top:2px}
.kpi[data-m]{cursor:pointer}
.kpi[data-m]:hover{border-color:var(--border-strong)}
.kpi .k-l{display:flex}
.rec .val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-2)}

.rec:last-child{border-bottom:0}
.rec .w{min-width:0}

/* ============================== Forms ============================== */
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-2)}
.input,.select{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:0 9px;color:var(--text)}
.input:focus,.select:focus{outline:none;border-color:var(--ink)}
.select.sm{height:26px;font-size:12px}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed var(--border-strong);border-radius:9px;padding:14px;text-align:center;color:var(--text-2);font-size:12px;transition:background .12s,border-color .12s}
.drop.over{background:var(--surface-2);border-color:var(--ink)}
.log{font-size:11.5px;line-height:1.6;max-height:100%;overflow:auto}
.log li{margin:0 0 2px}
.log .e{color:var(--critical)} .log .w{color:var(--text-2)} .log .ok{color:var(--good-text)}
pre.code{margin:0;font:11px/1.5 Consolas,"Cascadia Mono",ui-monospace,monospace;background:var(--surface-2);border-radius:8px;padding:10px;overflow:hidden;color:var(--text-2);position:absolute;inset:0;white-space:pre}
.src-list{font-size:11.5px;overflow:auto;height:100%}
.src-list li{padding:3px 0;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.src-list a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.plain{list-style:none;margin:0;padding:0}

.pick{display:flex;flex-direction:column;gap:2px;overflow:auto;height:100%}
.pick label{display:grid;grid-template-columns:16px minmax(0,1fr) 16px;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px}
.pick label:hover{background:var(--surface-2)}
.pick input{margin:0;accent-color:var(--ink)}
.pick .slot{font-size:10.5px;color:var(--muted)}
.pick label.dis{opacity:.72;cursor:not-allowed}
.ow{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.ow-yes{color:var(--text)}.ow-yes .ico{color:var(--good,#1f8a4c)}
.ow-no{color:var(--text-2)}
.tiers{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;overflow:hidden}
.tier{display:grid;grid-template-columns:52px minmax(0,38%) minmax(0,1fr);column-gap:12px;align-items:start}
.tier .tk{font-weight:700;font-size:13px;text-align:right}
.tier .tb{position:relative;height:16px;display:flex;align-items:center}
.tier .tb i{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--bar)}
.tier .tj{position:relative;font-size:11.5px;color:var(--text);padding-left:6px}
.tier .tm{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;line-height:16px}
.tier .tk{line-height:16px}
.slotn{display:inline-block;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center;text-shadow:0 0 2px rgba(0,0,0,.55);margin-right:5px;flex:none}
.cmp th .slotn{vertical-align:-3px}
.tbl.fit.cmp thead th{white-space:nowrap;vertical-align:middle}
.cmp .wins td{height:var(--rh,30px)}
.wb{display:inline-block;width:56px;height:8px;border-radius:4px;background:var(--surface-3);margin-right:8px;vertical-align:1px;overflow:hidden}
.wb i{display:block;height:100%;border-radius:4px}
.winbars{display:grid;grid-template-columns:auto minmax(48px,1fr) auto;gap:4px 10px}
.dtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dt{white-space:nowrap}
.dt{background:var(--surface-2);border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:6px}
.dt b{font-size:20px;font-weight:700}.dt span{font-size:11.5px;color:var(--text-2)}
.fresh{position:relative;height:8px;border-radius:4px;background:var(--surface-3);margin:4px 34px 0 0}
.fresh i{display:block;height:100%;border-radius:4px;background:var(--seq-hi)}.fresh i.old{background:var(--critical)}
.fresh span{position:absolute;top:-3px;margin-left:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.vres{font-size:12.5px;font-weight:650}.vres.ok{color:var(--good-text)}.vres.ng{color:var(--critical)}
.covers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 16px}
.cv{display:grid;grid-template-columns:8.8em minmax(0,1fr) 3.2em;gap:8px;align-items:center;font-size:11.5px;white-space:nowrap}
.cv .num{text-align:right}
.srct td{font-size:11.5px;line-height:1.3;white-space:normal}
.srct td.st{padding-top:2px;padding-bottom:2px}
.cv2{display:grid;grid-template-columns:minmax(0,1fr) 2em;gap:6px;align-items:center}.cv2 .num{text-align:right}
.abchips{display:flex;flex-wrap:wrap;gap:6px}
.abc{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:12px;border:1px solid var(--border)}
.abc.l2{background:var(--surface-3);border-color:var(--border-strong);font-weight:600}
.abc.l0{color:var(--muted);border-style:dashed}
.near{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;font-size:12px}
.binfo{display:grid;gap:12px;align-content:start}
.pgrid td{padding-top:0;padding-bottom:0}
.pgrid .lim{display:none}
.pgrid th{white-space:normal;vertical-align:bottom;line-height:1.25}
.pgrid .pgh{display:block;font-weight:400;font-size:10.5px}
.pgrid td:first-child{padding-right:12px}
.pgrid .lane{height:16px}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 4.2em;gap:8px;align-items:center}
.pg .num{text-align:right;font-size:11.5px}
.pg .ld.rk{width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.binfo.wide{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
.wbr{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center;font-size:12px}   /* 名前列は最長の名前に合わせ、全行で棒の起点をそろえる */
.wb.wide{width:auto;height:10px;margin:0}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ============================== Tooltip / Drawer ============================== */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:300px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .tt{font-weight:650;display:flex;align-items:center;gap:6px}
.tip .tv{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.tip .tm{color:var(--muted);font-size:11px;line-height:1.45}
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.28);z-index:39;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--surface);border-left:1px solid var(--border);z-index:40;
  transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.drawer header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.drawer header h3{margin:0;font-size:17px}
.drawer header .meta{font-size:11.5px;color:var(--muted)}
.drawer .dbody{padding:12px 16px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.drawer h4{margin:0 0 6px;font-size:11.5px;color:var(--text-2);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.kv dt{font-size:10.5px;color:var(--muted)} .kv dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 50px;gap:8px;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid var(--grid)}
.sc-row .rk{font-size:11px;color:var(--muted);text-align:right}
.mini{height:4px;border-radius:2px;background:var(--surface-3);position:relative;margin-top:3px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.note{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:9px 11px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ink-text);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:all .18s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ============================== Guide / Profile ============================== */
.kb{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:11px;border:1px solid var(--border-strong);font-size:11px;color:var(--text-2);white-space:nowrap;background:var(--surface)}
.kb i{font-style:normal;font-weight:700;color:var(--text)}
.flow{display:flex;align-items:stretch}
.flow .st{flex:1;min-width:0;background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.45}
.flow .st b{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-bottom:1px}
.flow .ar{flex:none;width:16px;display:grid;place-items:center;color:var(--muted)}
.flow .ar svg{width:10px;height:10px}
.flow.v{flex-direction:column;gap:0}
.flow.v .st{display:grid;grid-template-columns:58px 1fr;align-items:center}
.flow.v .st b{margin:0}
.flow.v .ar{width:100%;height:14px}
.flow.v .ar svg{transform:rotate(90deg)}
.comp{display:flex;gap:2px;height:20px;border-radius:5px;overflow:hidden}
.comp i{display:block;height:100%;min-width:3px;font-style:normal;font-size:10.5px;font-weight:650;line-height:20px;text-align:center;color:var(--text);overflow:hidden;white-space:nowrap}
.comp-l{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11px;color:var(--text-2);margin-top:5px}
.comp-l span{display:inline-flex;align-items:center;gap:5px}
.comp-l span i{width:9px;height:9px;border-radius:2px;display:inline-block}
.ab{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.ab.p{background:var(--ink)} .ab.s{border:2px solid var(--ink);opacity:.5} .ab.n{width:6px;height:2px;border-radius:1px;background:var(--border-strong);vertical-align:3px}
.list{display:flex;flex-direction:column;gap:1px;overflow:auto;height:100%}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:3px 8px;border-radius:7px;border:0;background:none;text-align:left;color:var(--text-2);font-size:12px;min-height:26px;flex:none}
.li > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.li:hover{background:var(--surface-2);color:var(--text)}
.li[aria-current="true"]{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.li-g{font-size:10.5px;color:var(--muted);padding:7px 8px 2px;letter-spacing:.04em}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.sig i{width:5px;border-radius:1px;background:var(--seq-hi)}
.sig i.na{background:var(--surface-3)}
.sec-h{font-size:11.5px;color:var(--text-2);font-weight:650;letter-spacing:.04em;margin:0 0 5px}
.pros{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12px;line-height:1.5}
.pros li{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start}
.pros li::before{content:"+";width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text);margin-top:1px}
.pros.cons li::before{content:"!";border:1px solid var(--border-strong);background:none;color:var(--text-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{height:24px;padding:0 10px;border-radius:12px;background:var(--surface-2);font-size:12px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border)}
.tag b{font-variant-numeric:tabular-nums}
.lead-q{font-size:15px;font-weight:600;line-height:1.5;margin:0}
.txt{font-size:12px;line-height:1.65;color:var(--text);margin:0}
.stack{display:grid;gap:12px;align-content:start}
.mat td.cat{text-align:center;font-variant-numeric:tabular-nums;font-size:11.5px;padding:0 4px}
.mat tr[data-prof]{cursor:pointer}
.mat .sum{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;max-width:0;width:34%}
.lim{font-size:10.5px;line-height:1;padding:2px 4px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text-2);margin-left:2px;flex:none}
.tc{display:flex;flex-direction:column;gap:10px;min-height:0}
.tc .lead2{font-size:12px;color:var(--text-2);line-height:1.6;margin:0}
.stats{display:grid;gap:6px}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.stat b{font-size:clamp(15px,1.15vw,19px);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11.5px;color:var(--text-2);line-height:1.4}
.impl{font-size:12px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:8px}
.impl::before{content:"→";font-weight:700;color:var(--text)}
.tc.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
/* 横長カードの文章列：縦に余裕があれば、示唆・数値・説明を均等に配置し、数値の文字を大きくする */
.tc.tx.roomy{justify-content:space-evenly}
.tc.tx.roomy .stat b{font-size:clamp(18px,1.5vw,24px)}
.tc.tx.roomy .stats{gap:12px}
.checks{display:grid;gap:3px}
.ck{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:11.5px;padding:2px 0}
.ck-i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--border-strong);color:var(--muted)}
.ck.done .ck-i{background:var(--good-text);border-color:var(--good-text);color:#fff}
.ck.doing .ck-i{border-color:var(--seq-hi);color:var(--seq-hi)}
.sbar{display:block;height:6px;border-radius:3px;background:var(--surface-3);margin-top:3px}.sbar>i{display:block;height:100%;border-radius:3px;background:var(--seq-hi)}
.sw-hatch{display:inline-block;width:12px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--seq-hi) 0 2.5px,color-mix(in oklab,var(--seq-hi) 45%,var(--surface)) 2.5px 4.5px)}
.scmp{display:grid;gap:2px;margin-top:4px}
.sc-r{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;gap:6px;align-items:center;font-size:11px}
.sc-r .sbar{margin:0}.sc-r .num{text-align:right;color:var(--text)}
.sbar>i.gray{background:var(--muted)}
.sbar>i.hatch{background:repeating-linear-gradient(135deg,var(--seq-hi) 0 2.5px,color-mix(in oklab,var(--seq-hi) 45%,var(--surface)) 2.5px 4.5px)}
.card-h{position:relative}
.readout{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:baseline;gap:8px;padding:3px 10px;border-radius:7px;background:var(--surface);box-shadow:0 0 0 1.5px var(--border-strong);font-size:12px;white-space:nowrap;overflow:hidden;z-index:3;pointer-events:none}
.readout .rv{font-weight:700;font-variant-numeric:tabular-nums}
.readout .rm{color:var(--text-2)}
.ck-s{font-size:10.5px;color:var(--text-2)}
.ck.done .ck-s{color:var(--good-text);font-weight:650}
.pf{display:grid;grid-auto-rows:1fr;gap:6px}
.pf-r{display:grid;grid-template-columns:minmax(0,0.85fr) 16px minmax(0,1.15fr);gap:6px;align-items:stretch;font-size:11.5px}
.pf-p{background:color-mix(in oklab,var(--critical) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--critical) 35%,transparent);border-radius:7px;padding:6px 8px;font-weight:650;display:flex;gap:6px;align-items:center}
.pf-i{flex:none;width:16px;height:16px;border-radius:50%;background:var(--critical);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.pf.narrow{grid-auto-rows:auto;align-content:space-between}
.pf.narrow .pf-r{grid-template-columns:1fr;gap:0}
.pf.narrow .pf-a{display:none}
.pf.narrow .pf-p{background:none;border:0;padding:0 0 2px}
.pf.narrow .pf-f{padding:3px 8px}
.pf-a{align-self:center;color:var(--text-2);font-weight:700;text-align:center}
.pf-f{background:color-mix(in oklab,var(--seq-hi) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--seq-hi) 35%,transparent);border-radius:7px;padding:6px 8px;color:var(--text);display:flex;align-items:center;line-height:1.4}
.stages{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:2px}
.stg{border-radius:8px;padding:7px 10px;display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:10px;align-items:center;font-size:11.5px;color:var(--text-2);border:1.5px solid var(--seq-hi);min-width:0}
.stg b{font-size:12px;color:var(--text)}
.stg.s0{border-style:dashed}
.stg.s1{background:color-mix(in oklab,var(--seq-hi) 12%,transparent)}
.stg.s2{background:color-mix(in oklab,var(--seq-hi) 26%,transparent)}
.stg-a{align-self:center;font-size:10.5px;color:var(--muted)}
.loopback{font-size:11.5px;color:var(--text-2);border:1.5px dashed var(--border-strong);border-radius:8px;padding:5px 10px;text-align:center}
.srcs{font-size:10.5px;color:var(--muted);line-height:1.4}
.srcs a{color:var(--muted)}
.conf-key{display:inline-flex;align-items:center;gap:5px}
button.info{padding:0;background:none;cursor:pointer}
button.info:hover{border-color:var(--ink);color:var(--text)}
@media (forced-colors: active){ .mk{forced-color-adjust:none} }
@media (max-width:1700px){ .filters .lbl{display:none} .chip{padding:0 7px;font-size:11.5px} .filters{gap:4px} }
@media (max-width:1280px){ .nav-item small{display:none} }

    // xFit：線形軸をデータの範囲に合わせる（発表日など0起点に意味がない量）
    const xr = Math.max(...xs) - Math.min(...xs) || 1;
    const xl = o.xLog ? Math.pow(10, Math.floor(Math.log10(Math.min(...xs)))) : o.xFit ? Math.min(...xs) - xr * 0.06 : 0;
    const xh = o.xLog ? Math.pow(10, Math.ceil(Math.log10(Math.max(...xs) * 1.05))) : o.xFit ? Math.max(...xs) + xr * 0.06 : niceMax(Math.max(...xs));
    const yr = Math.max(...ys) - Math.min(...ys), ystep = niceMax(Math.max(yr, 1) / 4);
    const yl = o.yZero ? 0 : Math.floor((Math.min(...ys) - yr * 0.12) / ystep) * ystep, yh = Math.ceil((Math.max(...ys) + yr * 0.12 + 1e-9) / ystep) * ystep;
    const X = v => L + (o.xLog ? (Math.log10(v) - Math.log10(xl)) / (Math.log10(xh) - Math.log10(xl)) : (v - xl) / (xh - xl)) * (W - L - R);
    const Y = v => T + (1 - (v - yl) / (yh - yl || 1)) * (H - T - Bm);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "")}">`;
    const xt = o.xLog ? logTicks(xl, xh, W - L - R) : o.xTicks ? o.xTicks(xl, xh) : ticks(xl, xh);
    // 左端の目盛は軸の内側に寄せる（縦軸の目盛と重ならない）
    xt.forEach(t => { const x = X(t), lw = measure(o.xTick(t), 10.5), edge = x - lw / 2 < L + 2; s += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${H - Bm}"/><text class="ax" x="${edge ? x + 2 : x}" y="${H - Bm + 14}" text-anchor="${edge ? "start" : "middle"}">${esc(o.xTick(t))}</text>`; });
    ticks(yl, yh, 4).forEach(t => { s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L - 6}" y="${Y(t) + 3.5}" text-anchor="end">${esc(o.yTick ? o.yTick(t) : fmt.num(t, 0))}</text>`; });
    s += `<text class="ax" x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xLabel)}</text>`;
    s += `<text class="ax halo" x="${L + 4}" y="${T + 11}" style="font-weight:600;fill:var(--text-2)">${esc(o.yLabel)}</text>`;   // 縦軸名は横書きで左上に
    if (o.frontier) { // x の良い順（既定は小さいほど良い＝安い順）に、より高性能になる点のみをつなぐ
      const dir = o.xHigher ? -1 : 1, f = []; let best = -Infinity; [...pts].sort((a, b) => dir * (a.x - b.x) || b.y - a.y).forEach(p => { if (p.y > best) { f.push(p); best = p.y; } });
      if (f.length > 1) { let d = `M${X(f[0].x)},${Y(f[0].y)}`; for (let i = 1; i < f.length; i++) d += `H${X(f[i].x)}V${Y(f[i].y)}`; s += `<path d="${d}" fill="none" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`; }
      f.forEach(p => p.front = true);
      const fp = []; f.forEach((p, i) => { if (i) fp.push([X(p.x), Y(f[i - 1].y)]); fp.push([X(p.x), Y(p.y)]); }); o._obs = lineObstacles(fp, 1.5);
    }
    pts.sort((a, b) => b.y - a.y);
    // 前線上の点は右方向に破線が伸びるため、上・左を優先
    const lab = o.labelIf ? pts.filter(p => o.labelIf(p)) : pts;
    pts.forEach(p => p._l = null);
    placeLabels(lab.map(p => ({ p, cx: X(p.x), cy: Y(p.y), text: p.m.name, weight: p.front ? 600 : 400, order: p.front ? ["top", "left", "bottom"] : null })), { L, R: W - 2, T: 0, B: H - Bm }, { obstacles: [...(o._obs || []), ...pts.filter(p => !lab.includes(p)).map(p => ({ x: X(p.x) - 6, y: Y(p.y) - 6, w: 12, h: 12 }))], hide: !!o.hideLabels });
    const hidden = lab.filter(p => !p._l).length;
    pts.forEach(p => {
      const cx = X(p.x), cy = Y(p.y);
      const tip = Tip.add(tipModel(p.m, null, null, { rank: p.tip, note: p.note, src: p.src }));
      s += `<g data-t="${tip}" data-m="${esc(p.m.id)}"><circle class="hit" cx="${cx}" cy="${cy}" r="14"/>
        <circle class="mk" cx="${cx}" cy="${cy}" r="${p.front ? 7 : o.labelIf && !o.labelIf(p) ? 4.5 : 6}" fill="${color(p.m)}" stroke="var(--surface)" stroke-width="${o.labelIf && !o.labelIf(p) ? 1 : 2}"/>
        ${p._l ? `<text class="lb2" x="${p._l[0]}" y="${p._l[1] + 11}"${p.front ? ' font-weight="600" style="fill:var(--text)"' : ""}>${esc(p.m.name)}</text>` : ""}</g>`;
    });
    hiddenNote(host, hidden);
    host.innerHTML = s + "</svg>";
  },

  /** ダンベル（入力/出力単価・対数軸） */
  dumbbell(host, rows) {
    if (!rows.length) return this.empty(host);
    const { W, H } = this.size(host);
    // 行が詰まりすぎる場合は上位だけ描き、残りは件数で示す（hbar と同じ規則）
    const minRow = 16; let more = 0;
    if ((H - 16) / rows.length < minRow) { const k = Math.max(3, Math.floor((H - 16 - 14) / minRow)); more = rows.length - k; rows = rows.slice(0, k); }
    const labelW = clamp(Math.max(...rows.map(r => measure(r.m.name))) + 24, 80, W * 0.4), R = 46, axisH = 16, n = rows.length;
    const rowH = Math.min(34, (H - axisH - (more ? 14 : 0)) / n);
    const all = rows.flatMap(r => [r.a, r.b]).filter(isNum);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...all)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
    const X = v => labelW + (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * (W - labelW - R);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="API単価">`;
    for (const v of logTicks(lo, hi, W - labelW - R)) { s += `<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${n * rowH}"/><text class="ax" x="${X(v)}" y="${n * rowH + 12}" text-anchor="middle">${esc(fmt.usd(v))}</text>`; }
    rows.forEach((r, i) => {
      const cy = i * rowH + rowH / 2, m = r.m;
      const tip = Tip.add(tipModel(m, "API単価（100万トークン当たり）", `${fmt.usd(r.a)} → ${fmt.usd(r.b)}`, { rank: `入力 ${fmt.usd(r.a)} / 出力 ${fmt.usd(r.b)}` + (isNum(m.price?.cachedInput) ? ` / キャッシュ入力 ${fmt.usd(m.price.cachedInput)}` : ""), note: m.price?.note }));
      s += `<g class="r" data-t="${tip}" data-m="${esc(m.id)}"><rect class="row-hover" x="0" y="${i * rowH}" width="${W}" height="${rowH}" rx="5"/>
        <circle cx="7" cy="${cy}" r="4" fill="${color(m)}"/><text class="lb" x="16" y="${cy + 4}">${esc(fitText(m.name, labelW - 22))}</text>
        <line x1="${X(r.a)}" x2="${X(r.b)}" y1="${cy}" y2="${cy}" stroke="${color(m)}" stroke-width="2" opacity=".55"/>
        <circle class="mk" cx="${X(r.a)}" cy="${cy}" r="4.5" fill="var(--surface)" stroke="${color(m)}" stroke-width="2"/>
        <circle class="mk" cx="${X(r.b)}" cy="${cy}" r="5" fill="${color(m)}" stroke="var(--surface)" stroke-width="1.5"/>
        <text class="vl" x="${X(r.b) + 9}" y="${cy + 4}">${esc(fmt.usd(r.b))}</text></g>`;
    });
    if (more) s += `<text class="ax" x="16" y="${H - 2}" style="fill:var(--text-2)">ほか ${more} モデル（全件は仕様一覧）</text>`;
    host.innerHTML = s + "</svg>";
  },

  /** レーダー（各軸＝可視モデル中の首位を100とした相対値） */
  radar(host, series, axes) {
    const { W, H } = this.size(host);
    if (axes.length < 3) return this.empty(host, "選択したモデルに共通するベンチマークが3つ未満のため、レーダーを描けません。右の表で比較してください。");
    const cx = W / 2, cy = H / 2 + 4, r = Math.min(W / 2 - 92, H / 2 - 30), n = axes.length;
    const P = (i, t) => [cx + Math.sin(2 * Math.PI * i / n) * r * t, cy - Math.cos(2 * Math.PI * i / n) * r * t];
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="レーダー比較">`;
    [0.25, 0.5, 0.75, 1].forEach(t => { s += `<polygon fill="none" class="gl" points="${axes.map((_, i) => P(i, t).join(",")).join(" ")}"/>`; });
    axes.forEach((a, i) => { const [x, y] = P(i, 1), [lx, ly] = P(i, 1.13); s += `<line class="gl" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>
      <text class="lb2" x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end"}">${esc(a.short)}</text>`; });
    s += `<text class="ax" x="${cx + 3}" y="${cy - r * 0.5 - 2}">50</text><text class="ax" x="${cx + 3}" y="${cy - r - 2}">100</text>`;
    series.forEach(sr => {
      const pts = axes.map((a, i) => P(i, clamp(a.norm(sr.m), 0, 1)));
      s += `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${color(sr.m)}" fill-opacity=".09" stroke="${color(sr.m)}" stroke-width="2" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ""} stroke-linejoin="round"/>`;
      pts.forEach((p, i) => { const a = axes[i], v = score(sr.m, a.id);
        const tip = Tip.add(tipModel(sr.m, a.label, fmt.unit(v, a.unit), { rank: `首位比 ${fmt.num(a.norm(sr.m) * 100, 0)}`, note: sr.m.scores[a.id]?.note, src: sr.m.scores[a.id]?.src }));
        s += `<g data-t="${tip}" data-m="${esc(sr.m.id)}"><circle class="hit" cx="${p[0]}" cy="${p[1]}" r="10"/><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${sr.hollow ? "var(--surface)" : color(sr.m)}" stroke="${color(sr.m)}" stroke-width="2"/></g>`; });
    });
    host.innerHTML = s + "</svg>";
  },

  /** 発表タイムライン（提供元ごとのレーン） */
  timeline(host, models) {
    const ms = models.filter(m => m.released);
    if (!ms.length) return this.empty(host, "発表日のあるモデルがありません");
    const { W, H } = this.size(host);
    const provs = [...new Set(ms.map(m => m.provider))].map(id => S.D.pv.get(id));
    const t = s => new Date(s + "T00:00:00Z").getTime();
    const tmin = Math.min(...ms.map(m => t(m.released))), tmax = Math.max(...ms.map(m => t(m.released)), t(S.D.meta.asOf || "2026-01-01"));
    const d0 = new Date(tmin); d0.setUTCDate(1); const d1 = new Date(tmax); d1.setUTCMonth(d1.getUTCMonth() + 1, 1);
    const L = clamp(Math.max(...provs.map(p => measure(p.label, 11))) + 14, 60, 110), R = 8, T = 6, Bm = 20, laneH = Math.min(52, (H - T - Bm) / provs.length);
    const X = v => L + (v - d0.getTime()) / (d1.getTime() - d0.getTime()) * (W - L - R), X0 = m => X(t(m.released));
    const placed = [];
    provs.forEach((p, i) => ms.filter(m => m.provider === p.id).forEach(m => placed.push({ x: X0(m) - 6, y: T + i * laneH + laneH / 2 - 6, w: 12, h: 12 })));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="発表タイムライン">`;
    for (const d = new Date(d0); d <= d1; d.setUTCMonth(d.getUTCMonth() + 1)) { const x = X(d.getTime()); s += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${T + laneH * provs.length}"/>`; const asX = S.D.meta.asOf ? X(t(S.D.meta.asOf)) : -1e9; if (x + 28 < W - R && !(x + 30 > asX - 70 && x < asX + 6)) s += `<text class="ax" x="${x + 3}" y="${T + laneH * provs.length + 13}">${d.getUTCMonth() + 1}月</text>`; }
    if (S.D.meta.asOf) { const x = X(t(S.D.meta.asOf)); s += `<line x1="${x}" x2="${x}" y1="${T}" y2="${T + laneH * provs.length}" stroke="var(--text-2)" stroke-dasharray="3 3"/><text class="ax" x="${x - 3}" y="${T + laneH * provs.length + 13}" text-anchor="end" style="fill:var(--text-2)">基準日 ${esc(S.D.meta.asOf.slice(5).replace("-", "/"))}</text>`; }
    provs.forEach((p, i) => {
      const y = T + i * laneH + laneH / 2;
      s += `<text class="lb2" x="0" y="${y + 4}">${esc(p.label)}</text><line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
      const lane = ms.filter(m => m.provider === p.id).sort((a, b) => t(a.released) - t(b.released));
      lane.forEach(m => {
        const x = X(t(m.released)), w = measure(m.name, 11) + 4, h = 13;
        // 候補：上 → 下 → 右 → 左。既配置ラベル・点と重ならない最初の位置
        const cands = [[x - w / 2, y - 7 - h], [x - w / 2, y + 7], [x + 8, y - h / 2], [x - 8 - w, y - h / 2], [x - w / 2, y - 9 - 2 * h], [x - w / 2, y + 9 + h], [x - w, y - 7 - h], [x, y + 7]]
          .map(([lx, ly]) => [clamp(lx, L, W - R - w), ly]).filter(([, ly]) => ly > 0 && ly + h < H - Bm);
        const cost = ([lx, ly]) => placed.reduce((acc, b) => acc + Math.max(0, Math.min(lx + w, b.x + b.w) - Math.max(lx, b.x)) * Math.max(0, Math.min(ly + h, b.y + b.h) - Math.max(ly, b.y)), 0);
        const pos = cands.find(c => cost(c) === 0);   // 置けない場合はラベルを省略（点のツールチップで確認できる）
        if (pos) placed.push({ x: pos[0], y: pos[1], w, h });
        const tip = Tip.add(tipModel(m, "発表日", fmt.date(m.released), { rank: m.tier }));
        s += `<g data-t="${tip}" data-m="${esc(m.id)}"><circle class="hit" cx="${x}" cy="${y}" r="11"/><circle class="mk" cx="${x}" cy="${y}" r="5.5" fill="${color(m)}" stroke="var(--surface)" stroke-width="2"/>
          ${pos ? `<text class="lb2" x="${pos[0]}" y="${pos[1] + 10}" ${m.legacy ? 'style="opacity:.6"' : ""}>${esc(m.name)}</text>` : ""}</g>`;

const card = (title, sub, body, opt = {}) => `<section class="card" style="${opt.style || ""}"><div class="card-h"><h2>${title}</h2>${sub ? `<span class="sub">${sub}</span>` : ""}${opt.right ? `<div class="right">${opt.right}</div>` : ""}</div><div class="body">${body}</div>${opt.foot || ""}</section>`;
const host = id => `<div class="chart" id="${id}"></div>`;

const VIEWS = [
  { id: "overview", label: "概要", hint: "結論と推奨", lead: "まず結論：用途ごとに何を選ぶべきか", render: renderOverview },
  { id: "models", label: "モデル特徴", hint: "強みと注意点", lead: "モデルごとの得意・不得意と立ち位置", subs: () => [{ id: "matrix", label: "早見表" }, { id: "profile", label: "プロフィール" }], render: renderModels },
  { id: "compare", label: "比較", hint: "最大4モデル", lead: "モデルを選ぶと、項目ごとの位置と値を並べて比較", render: renderCompare },
  { id: "bench", label: "ベンチマーク", hint: "分野別の性能", lead: "カテゴリを選ぶと、その全ベンチマークを並べて表示", subs: () => [...S.D.cats.map(c => ({ id: c.id, label: c.label, n: S.D.benchmarks.filter(b => (b.category || "other") === c.id).length })), { id: "heat", label: "全体ヒートマップ" }], render: renderBench },
  { id: "guide", label: "ベンチ解説", hint: "指標の意味", lead: "各ベンチマークが測る能力・採点方法・読み方", subs: () => [{ id: "map", label: "全体像" }, { id: "detail", label: "個別解説" }], render: renderGuide },
  { id: "cost", label: "コスト", hint: "価格性能・試算", lead: "性能あたりの価格と、利用量に応じた月額の目安", render: renderCost },
  { id: "speed", label: "速度・容量", hint: "速さと文脈長", lead: "応答の速さと、一度に扱える情報量", render: renderSpeed },
  { id: "table", label: "仕様一覧", hint: "全項目の表", lead: "列見出しクリックで並べ替え", render: renderTable },
  { id: "future", label: "次世代・動向", hint: "今後と技術", lead: "旧世代 → 現行 → 次世代の流れと、技術・規制の動向", subs: () => [{ id: "roadmap", label: "系譜と投入予定" }, { id: "diffusion", label: "拡散型LM" }, { id: "capability", label: "能力とコスト" }, { id: "infra", label: "基盤と普及" }, { id: "frontier", label: "新領域" }, { id: "safety", label: "安全・規制" }], render: renderFuture },
  { id: "history", label: "AIの歴史", hint: "誕生から現在", lead: "1943年の形式ニューロンから現在まで。年表と性能の伸び", subs: () => [{ id: "timeline", label: "年表" }, { id: "growth", label: "性能の伸び" }], render: renderHistory },
  { id: "data", label: "データ管理", hint: "最新化と出典", lead: "JSONの読込／URL自動取得でHTMLを編集せずに最新化", render: renderData },
];

function renderOverview(v) {
  const ms = visible(), D = S.D;
  v.style.gridTemplateColumns = "minmax(0,1fr) minmax(0,1.2fr)";
  v.style.gridTemplateRows = "auto minmax(0,1fr)";
  // ① 結論：KPI（各指標の首位・次点との差・全体の中の位置）
  const kpi = D.kpis.map(k => {
    const mt = metric(k.metric); if (!mt) return "";
    const r = ranked(mt, ms, k.filter); const a = r[0], b = r[1];
    if (!a) return `<div class="card kpi"><div class="k-l">${esc(k.label)}</div><div class="k-d">データなし</div></div>`;
    const diff = b && Math.abs(a.v - b.v) < 1e-9 ? `次点 ${esc(b.m.name)} と同${mt.unit === "$/1M" ? "額" : "値"}` : b ? (mt.unit === "$/1M" ? `次点 ${esc(b.m.name)} は ${fmt.num(b.v / a.v, 1)} 倍` : `次点 ${esc(b.m.name)} に ${mt.higher ? "+" : "−"}${fmt.num(Math.abs(a.v - b.v))}${mt.unit === "%" ? "pt" : ""}`) : "比較対象なし";
    return `<div class="card kpi" data-m="${esc(a.m.id)}" title="${esc(mt.name)}"><div class="k-l">${ico(metricIcon(k.metric, k.icon))}${esc(k.label)}<span class="go" style="margin-left:auto;font-size:11.5px">詳細</span></div>
      <div class="k-row"><div><div class="k-m"><span class="sw" style="background:${color(a.m)}"></span>${esc(a.m.name)}</div>
      <div class="k-v"><b class="num">${esc(mt.fmt(a.v).replace(/ tok\/s|\/1M/, ""))}</b><span>${esc(mt.unit === "%" ? "" : mt.unit)}</span></div></div>
      ${lane(r, mt, { top: 2, ends: true })}</div>
      <div class="k-d">${diff}</div></div>`;
  }).join("");
  // ② 用途別の推奨（主役）：アイコン＋用途、推奨モデルと値、全体の中の位置（首位・次点）、比較への導線
  const recs = D.useCases.map(u => {
    const mt = metric(u.metric); if (!mt) return "";
    const r = ranked(mt, ms, u.filter); const a = r[0], b = r[1];
    const head = `${ico(metricIcon(u.metric, u.icon), "lg")}<div class="u">${phr(u.label)}<small>${esc(mt.short)}</small></div>`;
    if (!a) return `<div class="rec">${head}<div class="w na">該当データなし</div><span></span></div>`;
    return `<div class="rec">${head}
      <div class="w"><div class="wl">${mName(a.m)}<b class="num">${esc(mt.fmt(a.v))}</b></div><div class="wr"><span class="why">${b ? `次点 ${esc(b.m.name)}（${esc(mt.fmt(b.v))}）` : "比較対象なし"}</span>${lane(r, mt, { top: 2 })}</div></div>
      ${b ? `<button class="go" data-cmp="${esc(a.m.id)},${esc(b.m.id)}" title="${esc(a.m.name)} と ${esc(b.m.name)} を比較">比較</button>` : "<span></span>"}</div>`;
  }).join("");
  // ③ 根拠：ベンチマーク別の上位3（位置のレーン＋名前）
  const rows = podiumRows(D.benchmarks, ms, { others: false });   // 概要では上位3の点だけ（主役の推奨より軽く見せる）
  v.innerHTML = `<div class="kpis" style="grid-column:1/-1">${kpi}</div>
    ${card("用途別の推奨", "首位モデルと、全モデル中の位置（①首位 ②次点・灰＝その他）", `<div class="recs" id="recs">${recs}</div>`)}
    ${card("ベンチマーク別の上位3モデル", `表示中 ${ms.length} モデル・点＝上位3の位置（右ほど高い）・名前で解説へ`, podiumTable(rows, "podiumWrap"))}`;
  const recEl = $("#recs"), rh = Math.max(48, (recEl.parentElement.clientHeight - 2) / Math.max(1, D.useCases.length));
  recEl.style.setProperty("--rh", rh + "px"); recEl.classList.toggle("tall", rh >= 84);   // 縦に余裕があれば位置レーンを全幅に広げる
  fitRows($("#podiumWrap"), 30, 56);
  fixLanes(v);
  v.querySelectorAll("[data-cmp]").forEach(btn => btn.onclick = () => compareWith(btn.dataset.cmp.split(",")).run());
}

/** 同じ能力を測る関連ベンチ（主に測る能力の重なりが大きい順・データのあるものだけ） */
function relatedBenches(b, ms, k = 5) {
  const ov = x => S.D.abilities.reduce((t, a) => t + Math.min(b.abilities?.[a.id] || 0, x.abilities?.[a.id] || 0), 0);
  return S.D.benchmarks.filter(x => x !== b && ranked(metric("bench:" + x.id), ms).length).map(x => ({ x, k: ov(x) })).filter(o => o.k >= 2).sort((a, c) => c.k - a.k).slice(0, k).map(o => o.x);
}
/** ベンチマーク別の上位3（位置レーン＋上位3の名前と値）。概要・ベンチ・解説で共通の部品 */
function podiumRows(bs, ms, opt = {}) {
  return bs.map(bm => {
    const mt = metric("bench:" + bm.id), r = ranked(mt, ms);
    if (!r.length) return "";
    const cat = S.D.cats.find(c => c.id === (bm.category || "other"));
    const nm = (i, cls) => r[i] ? `<span class="pc ${cls}"><span class="rk">${i + 1}</span>${mName(r[i].m)}<span class="v">${esc(mt.fmt(r[i].v))}</span></span>` : "";
    return `<tr><td><span class="bn" data-gb="${esc(bm.id)}" style="cursor:pointer" title="${esc(bm.label)}の解説">${esc(bm.short || bm.label)}</span><span class="cat" title="${esc(cat?.label || "")}">${ico(CAT_ICON[cat?.id] || "bench", "sm")}${r.length}モデル</span></td>
      <td>${lane(r, mt, { others: opt.others })}</td><td><div class="p1">${nm(0, "c1")}</div><div class="p23">${nm(1, "")}${nm(2, "")}</div></td></tr>`;
  }).join("");
}
const podiumTable = (rows, id) => `<div style="position:absolute;inset:0;overflow:hidden" id="${id}"><table class="tbl podium"><colgroup><col style="width:16%"><col style="width:27%"><col style="width:57%"></colgroup><thead><tr><th>ベンチマーク</th><th>全モデル中の位置</th><th>上位3モデル</th></tr></thead><tbody>${rows}</tbody></table></div>`;
/** モデルの横顔：行＝モデル、列＝指標。各セルに「全モデル中の位置」のレーン（そのモデルだけ色）と値を並べる */
function profileGrid(models, specs, ms, id, opt = {}) {
  const cols = specs.map(metric).filter(Boolean).map(mt => ({ mt, r: ranked(mt, ms) }));
  const head = `<thead><tr><th>モデル</th>${cols.map(c => `<th title="${esc(c.mt.name)}">${esc(c.mt.short)}<span class="muted pgh">${c.mt.higher ? "右ほど良い →" : "← 左ほど安い"}</span></th>`).join("")}</tr></thead>`;
  const body = models.map(m => `<tr><td>${mName(m)}</td>${cols.map(c => { const x = c.r.find(o => o.m === m);
    return x ? `<td><div class="pg">${lane(c.r, c.mt, { marks: [{ m, t: "" }] })}<span class="num">${esc(c.mt.fmt(x.v).replace(/ tok\/s|\/1M/, ""))}</span></div></td>` : `<td class="na">—</td>`; }).join("")}</tr>`).join("");
  return `<div style="${opt.auto ? "" : "position:absolute;inset:0;"}overflow:hidden" id="${id}"><table class="tbl pgrid" style="table-layout:fixed"><colgroup><col style="width:${cols.length > 4 ? 18 : 22}%">${cols.map(() => "<col>").join("")}</colgroup>${head}<tbody>${body}</tbody></table></div>`;
}
/** 枠に収まらないとき、優先度の低い要素（selectors の順）から省き、省いた文章は見出しのツールチップへ移す（切れたまま見せない） */
function shed(root, selectors) {
  root.querySelectorAll(".tc").forEach(tc => {
    for (const sel of selectors) {
      if (tc.scrollHeight <= tc.clientHeight + 1) return;
      const els = [...tc.querySelectorAll(sel)].reverse();
      for (const el of els) { if (tc.scrollHeight <= tc.clientHeight + 1) return; const h = tc.closest(".card")?.querySelector("h2"); if (h && el.textContent.trim()) h.title = (h.title ? h.title + "\n" : "") + el.textContent.trim(); el.remove(); }
    }
  });
}
/** 箱 box が収まらないとき、指定の要素を後ろから省く（shed の単一要素版） */
function shedBox(box, selectors) { for (const sel of selectors) for (const el of [...box.querySelectorAll(sel)].reverse()) { if (box.scrollHeight <= box.clientHeight + 1) return; el.closest("div:not(.legend)")?.remove?.() ?? el.remove(); } }
/** 縦一覧（.li と見出し .li-g）の行の高さを、枠の高さに合わせて配分する（下に空白を残さない） */
function fillList(list, lo = 19, hi = 40) { if (!list) return; const li = list.querySelectorAll(".li"), ng = list.querySelectorAll(".li-g").length; const gh = list.querySelector(".li-g")?.offsetHeight || 24;
  li.forEach(el => el.style.minHeight = clamp((list.clientHeight - ng * gh) / Math.max(1, li.length) - 2, lo, hi) + "px");
  for (let k = 0; k < 8 && list.scrollHeight > list.clientHeight + 1; k++) li.forEach(el => el.style.minHeight = Math.max(lo, parseFloat(el.style.minHeight) - 1) + "px"); }
/** 全モデルの表で下位行を省いたときの案内（全件を見るための操作を示す） */
const moreModels = n => `ほか ${n} モデル（${S.f.legacy ? "「旧世代も表示」を外すか、" : ""}提供元で絞り込むと全件表示）`;
/** 表の行高を、枠の高さに合わせて配分する（スクロールさせない） */
function fitRows(wrap, lo = 22, hi = 56, more = n => `ほか ${n} モデル（全件はヒートマップ・仕様一覧）`) {
  if (!wrap) return;
  // 上位3の表で、2・3位の名前が幅に入らなければ3位を省く（名前を省略記号で切らない）
  const cg = wrap.querySelectorAll(".podium col"); if (cg.length === 3 && wrap.clientWidth < 640) { cg[0].style.width = "20%"; cg[1].style.width = "18%"; cg[2].style.width = "62%"; }   // 狭い枠ではレーンを細くして名前に幅を回す
  wrap.querySelectorAll(".p23").forEach(p => { while (p.scrollWidth > p.clientWidth + 1 && p.children.length > 1) p.lastElementChild.remove(); }); const n = wrap.querySelectorAll("tbody tr").length, th = wrap.querySelector("thead")?.offsetHeight || 0; wrap.style.setProperty("--rh", clamp((wrap.clientHeight - th - 2) / Math.max(1, n), lo, hi) + "px");
  // それでも収まらない場合は下位の行を省き、件数を明示する（切れたまま見せない）
  const body = wrap.querySelector("tbody"); let cut = 0;
  while (wrap.scrollHeight > wrap.clientHeight + 1 && body.rows.length > 2) { body.deleteRow(-1); cut++; }
  if (cut) { body.deleteRow(-1); cut++; const tr = body.insertRow(); const td = tr.insertCell(); td.colSpan = [...(body.rows[0]?.cells || [])].reduce((a, c) => a + c.colSpan, 0) || 1; td.className = "muted"; td.style.fontSize = "11px"; td.textContent = more(cut); }
}

function renderBench(v) {
  const D = S.D, ms = visible();
  const sub = S.sub.bench || D.cats[0]?.id;
  if (sub === "heat") return renderHeat(v, ms);
  const bs = D.benchmarks.filter(b => (b.category || "other") === sub);
  const n = bs.length, cols = n <= 1 ? 1 : n === 2 ? 2 : n === 4 ? 2 : 3, rowsN = Math.ceil((n + (n > 4 && n % 3 ? 1 : 0)) / cols);
  // 1〜2指標のカテゴリはデータ点が少ないため、棒グラフ（行数に合わせた高さ）＋「上位モデルの横顔」＋指標の見方で構成
  const rel2 = n === 2 ? [...new Set(bs.flatMap(b => relatedBenches(b, ms, 6)))].filter(x => !bs.includes(x)).slice(0, 6) : [];
  const few = n <= 2, kMax = Math.max(1, ...bs.map(b => ranked(metric("bench:" + b.id), ms).length));
  // 棒グラフの段は「行数×約44px＋見出し・軸」の内容の高さ（棒の太さは全画面共通の上限22px）
  const chartH = Math.round(clamp(kMax * 44 + 110, 200, v.clientHeight * (n === 1 ? 0.62 : 0.45)));
  v.style.gridTemplateColumns = n === 1 ? "minmax(0,1fr) minmax(0,1fr)" : `repeat(${cols},minmax(0,1fr))`;
  // 3指標以上：各段の高さを、その段で最も行数の多いグラフに比例させる（行の少ない段を詰め、空白を減らす）
  const cnt = bs.map(b => ranked(metric("bench:" + b.id), ms).length), need = (b, k) => 96 + (b.caveat ? 34 : 0) + k * 20;   // カード1枚に必要な高さの目安（見出し＋注記＋軸＋行）
  const nWin = new Set(bs.map(b => ranked(metric("bench:" + b.id), ms)[0]?.m).filter(Boolean)).size;
  const rowFr = Array.from({ length: rowsN }, (_, k) => Math.max(...bs.slice(k * cols, k * cols + cols).map((b, j) => need(b, cnt[k * cols + j])), k === rowsN - 1 && n > 4 && n % 3 ? 70 + nWin * 22 : 0));   // 最後の段は「首位の数」カードも考慮
  // 1指標：左＝グラフ（内容の高さ）＋見方（残り）、右＝横顔表（全高・行を配分）
  v.style.gridTemplateRows = n === 1 ? "minmax(0,1fr)" : n === 2 ? `${chartH}px auto ${rel2.length ? "minmax(0,1fr) " : ""}auto` : rowFr.map(f => `minmax(0,${f}fr)`).join(" ");
  const r0 = few ? ranked(metric("bench:" + bs[0].id), ms) : [], rk = m => { const i = r0.findIndex(x => x.m === m); return i < 0 ? 99 : i; };
  const pgModels = few ? ms.filter(m => bs.some(b => score(m, b.id) != null)).sort((a, c) => rk(a) - rk(c)) : [];
  const pgSpecs = [...bs.map(b => "bench:" + b.id), ...(bs.some(b => b.id === "aa_index") ? [] : ["bench:aa_index"]), "price:blended", "spec:speed"];
  const pgCard = few ? card("上位モデルの横顔", "各指標での位置（色の点＝そのモデル・灰＝その他）", profileGrid(pgModels, pgSpecs, ms, "pgWrap", { auto: true }), { style: n === 2 ? "grid-column:1/-1" : "flex:none" }) : "";
  const charts = bs.map(b => card(esc(b.label), `${esc(b.unit === "Elo" ? "Elo（相対評価）" : b.unit === "%" ? "正答・成功率" : b.unit)}`,
    host("ch-" + b.id), { right: `<button class="info" data-gb="${esc(b.id)}" title="${esc(b.desc || "")}（クリックで解説へ）" aria-label="${esc(b.label)}の解説">i</button>`, style: "", foot: b.caveat ? `<div class="caveat">${esc(b.caveat)}</div>` : "" })).join("")
  ;
  // 1指標：左列＝グラフ（内容の高さ）→ 見方（残り）、右列＝横顔表（内容の高さ）→ 関連ベンチ（残り）
  const rel1 = n === 1 ? relatedBenches(bs[0], ms) : [];
  v.innerHTML = n === 1
    ? `<div class="bcol" style="display:grid;grid-template-rows:minmax(${chartH}px,1fr) minmax(0,auto);gap:12px;min-height:0">${charts}${benchInfo(bs[0], ms, "side")}</div>`
      + `<div style="display:grid;grid-template-rows:auto ${rel1.length ? "minmax(0,1fr)" : ""};gap:12px;min-height:0">${pgCard}${rel1.length ? card("同じ能力を測る関連ベンチ", "点の位置＝スコア・番号＝順位・名前で解説へ", podiumTable(podiumRows(rel1, ms), "benchRel")) : ""}</div>`
    : charts + pgCard + (n === 2 && rel2.length ? card("同じ能力を測る関連ベンチ", "点の位置＝スコア・番号＝順位・名前で解説へ", podiumTable(podiumRows(rel2, ms), "benchRel"), { style: "grid-column:1/-1" }) : "")
      + (n > 4 && n % 3 ? benchSummary(bs, ms, cols * rowsN - n) : n === 2 ? bs.map(b => benchInfo(b, ms, "compact")).join("") : "");
  // 横顔表は内容の高さで置き、画面に収まらなければ残りの高さに合わせて行を詰める（それでも入らない行は件数表示）
  const pw = $("#pgWrap");
  // 1指標で右列が収まらない場合：見方カードは内容の高さ（最大で半分）、横顔表は残りの高さに合わせて行を詰める
  if (n === 1) { const bi = v.querySelector(".binfo.side"), bd = bi.parentElement; bd.style.overflow = "hidden";
    // 左列：見方カードは内容の高さ（CSS の auto で決まる）。グラフの最小高さで押されて収まらない分は、優先度の低い要素から省く
    shedBox(bd, [".legend", ".comp-l", ".note"]);
    // 右列：横顔表が長すぎるときは上限（列の6割）で行を詰め、関連ベンチは残りの高さ（狭すぎれば省く）
    const col = pw.closest(".card").parentElement, pc = pw.closest(".card"); if (pc.offsetHeight > col.clientHeight * 0.62) { col.style.gridTemplateRows = `${Math.round(col.clientHeight * 0.62)}px minmax(0,1fr)`; pw.style.cssText = "position:absolute;inset:0;overflow:hidden"; }
    const rb = $("#benchRel"); if (rb && rb.clientHeight < 110) { rb.closest(".card").remove(); col.style.gridTemplateRows = "minmax(0,1fr)"; pw.style.cssText = "position:absolute;inset:0;overflow:hidden"; } else fitRows(rb, 30, 76, k => `ほか ${k} ベンチ`); }
  // 2指標：横顔表と見方は内容の高さ、グラフが残りを使う。収まらなければ横顔表を残りの高さに合わせて行を詰める
  const over = el => el && el.scrollHeight > el.clientHeight + 1;
  if (n === 2) { const rb = $("#benchRel");
    if (rb && rb.clientHeight < 110) { rb.closest(".card").remove(); v.style.gridTemplateRows = `minmax(${chartH}px,1fr) auto auto`; } else if (rb) fitRows(rb, 30, 64, k => `ほか ${k} ベンチ`);
    if (over(v) || over(pw.closest(".card")) || over(pw.closest(".body")) || [...v.querySelectorAll(".binfo")].some(b => over(b.closest(".card")))) { v.querySelector("#benchRel")?.closest(".card").remove(); v.style.gridTemplateRows = `${Math.min(chartH, 220)}px minmax(0,1fr) auto`; pw.style.cssText = "position:absolute;inset:0;overflow:hidden"; } }
  if (pw && getComputedStyle(pw).position === "absolute") fitRows(pw, 18, n === 2 ? 48 : 64);
  v.querySelectorAll("[data-cmp]").forEach(btn => btn.onclick = () => compareWith(btn.dataset.cmp.split(",")).run());
  const wst = v.querySelector(".winbars")?.parentElement; if (wst) { const wb = wst.firstElementChild; let cut = 0;   // 収まらなければ下位（首位数の少ない）行を畳み、件数を示す
    while (wst.scrollHeight > wst.clientHeight + 1 && wb.children.length > 2) { wb.lastElementChild.remove(); cut++; }
    if (cut) { wb.lastElementChild.remove(); cut++; wb.insertAdjacentHTML("beforeend", `<div class="wbr muted" style="font-size:11px"><span style="grid-column:1/-1">ほか ${cut} モデルも首位あり（グラフで確認）</span></div>`); } }
  if ($("#benchCmp")) $("#benchCmp").onclick = () => { const ids = []; bs.forEach(b => { const r = ranked(metric("bench:" + b.id), ms); if (r[0] && !ids.includes(r[0].m.id)) ids.push(r[0].m.id); }); compareWith(ids).run(); };
  fixLanes(v);
  bs.forEach(b => {
    const mt = metric("bench:" + b.id);
    const rows = ranked(mt, ms).map(r => ({ ...r, src: r.m.scores[b.id]?.src, note: r.m.scores[b.id]?.note }));
    Chart.hbar($("#ch-" + b.id), rows, { title: b.label, fmt: mt.fmt, max: b.max, zeroBased: b.zeroBased, maxRow: n === 1 ? 64 : n === 2 ? 56 : 60, maxBar: 22, median: true, emptyMsg: "表示中のモデルにこのベンチのデータがありません",
      diff: (a, c) => b.unit === "%" ? fmt.num(Math.abs(a - c)) + "pt" : fmt.num(Math.abs(a - c)), tick: t => b.unit === "%" ? t + "%" : fmt.num(t, 0), refs: b.refs });
  });
}

/** カテゴリ内でモデルごとに首位を取った指標数（グリッドの空き枠を要約の図と次の行動に使う） */
function benchSummary(bs, ms, span) {
  const wins = new Map(); bs.forEach(b => { const r = ranked(metric("bench:" + b.id), ms); if (r[0]) wins.set(r[0].m, (wins.get(r[0].m) || 0) + 1); });
  const lead = [...wins.entries()].sort((a, c) => c[1] - a[1]);
  return card("首位を取った指標の数", `${bs.length}指標のうち`, `<div class="stack" style="position:absolute;inset:0;gap:10px;overflow:hidden">
      <div class="winbars">${lead.map(([m, k]) => `<div class="wbr">${mName(m)}<div class="wb wide"><i style="width:${k / bs.length * 100}%;background:${color(m)}"></i></div><span class="num"><b>${k}</b><span class="muted">/${bs.length} 首位</span></span></div>`).join("")}</div>
      <div><button class="go" id="benchCmp">首位のモデルを比較</button></div></div>`, { style: span > 1 ? `grid-column:span ${span}` : "" });
}

/** 指標の見方カード：説明・評価の流れ・構成・公表数・未計測モデル・次の行動。
 *  mode="wide"（1指標のカテゴリ：全幅を左右2列で使う）／"compact"（2指標のカテゴリ：指標ごとに1枚） */
function benchInfo(b, ms, mode) {
  const mt = metric("bench:" + b.id), r = ranked(mt, ms);
  const missing = ms.filter(m => score(m, b.id) == null);
  const cat = S.D.cats.find(c => c.id === (b.category || "other"));
  const what = `<div class="note">${esc(b.desc || "説明は未登録です")}</div>
    ${b.flow ? `<div><div class="sec-h">評価の流れ</div>${flowHtml(b.flow)}</div>` : ""}
    ${b.composition ? `<div>${compHtml(b.composition)}</div>` : ""}`;
  const who = `${mode !== "compact" ? `<div><div class="sec-h">公表 ${r.length} / ${ms.length} モデル</div><div class="wb wide" style="display:block"><i style="width:${ms.length ? r.length / ms.length * 100 : 0}%;background:var(--seq-hi)"></i></div></div>` : ""}
    ${mode !== "compact" ? `<div><h4 style="margin:0 0 6px;font-size:11.5px;color:var(--text-2)">未公表・未計測のモデル（${missing.length}）</h4><div class="legend">${missing.length ? missing.map(m => mName(m)).join("") : '<span class="muted">なし</span>'}</div></div>` : ""}
    <div style="display:flex;gap:16px"><button class="go" data-gb="${esc(b.id)}">個別解説で詳しく</button>${r.length > 1 ? `<button class="go" data-cmp="${esc(r.slice(0, 3).map(x => x.m.id).join(","))}">上位3を比較</button>` : ""}</div>`;
  const body = mode === "wide" ? `<div class="stack">${what}</div><div class="stack">${who}</div>` : what + who;
  return card(`${esc(b.short || b.label)} の見方`, esc(cat?.label || ""), `<div class="binfo ${mode}">${body}</div>`, { style: mode === "wide" ? "grid-column:1/-1" : "" });
}

function renderHeat(v, ms) {
  const D = S.D, bs = D.benchmarks.filter(b => ms.some(m => score(m, b.id) != null));
  v.style.gridTemplateColumns = "minmax(0,1fr)"; v.style.gridTemplateRows = "minmax(0,1fr)";
  const range = Object.fromEntries(bs.map(b => { const vs = ms.map(m => score(m, b.id)).filter(isNum); return [b.id, [Math.min(...vs), Math.max(...vs)]]; }));
  const hs = S.heatSort || { key: "aa_index", dir: -1 };
  const sorted = [...ms].sort((a, b) => {
    const va = hs.key === "name" ? a.name : score(a, hs.key), vb = hs.key === "name" ? b.name : score(b, hs.key);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * hs.dir;
  });
  const groups = D.cats.map(c => ({ c, bs: bs.filter(b => (b.category || "other") === c.id) })).filter(g => g.bs.length);
  const head1 = `<tr><th></th>${groups.map(g => `<th colspan="${g.bs.length}" style="text-align:center;border-bottom:1px solid var(--border);font-size:10.5px;color:var(--muted)">${esc(g.c.label)}</th>`).join("")}<th></th></tr>`;
  const arr = k => hs.key === k ? `<span class="arr">${hs.dir < 0 ? "▼" : "▲"}</span>` : "";
  const head2 = `<tr><th class="sortable" data-hs="name">モデル${arr("name")}</th>${groups.flatMap(g => g.bs).map(b => `<th class="sortable r" data-hs="${esc(b.id)}" title="${esc(b.label)}">${esc(b.short || b.label)}${arr(b.id)}</th>`).join("")}<th class="r">公表数</th></tr>`;
  const body = sorted.map(m => `<tr><td>${mName(m)}${m.legacy ? ' <span class="muted" style="font-size:10.5px">旧</span>' : ""}</td>${groups.flatMap(g => g.bs).map(b => {
    const val = score(m, b.id); if (val == null) return `<td class="r na">—</td>`;
    const [lo, hi] = range[b.id]; const t = hi > lo ? (val - lo) / (hi - lo) : 1; const tt = b.higherIsBetter === false ? 1 - t : t;
    const tip = Tip.add(tipModel(m, b.label, fmt.unit(val, b.unit), { rank: `表示中の範囲 ${fmt.unit(lo, b.unit)}〜${fmt.unit(hi, b.unit)}`, note: m.scores[b.id]?.note, src: m.scores[b.id]?.src }));
    return `<td class="r num${val === (b.higherIsBetter === false ? lo : hi) ? " best" : ""}" data-t="${tip}" style="${seqStyle(tt)}">${esc(fmt.unit(val, b.unit).replace("%", ""))}</td>`;

function renderCompare(v) {
  const D = S.D, ms = visible(), sel = compareSel(ms);
  v.style.gridTemplateColumns = "258px minmax(0,1fr)";
  v.style.gridTemplateRows = "minmax(0,1fr)";
  const slot = new Map(sel.map((m, i) => [m, i + 1]));
  const picker = ms.map(m => { const on = slot.has(m), dis = !on && sel.length >= 4;
    return `<label class="${dis ? "dis" : ""}" ${dis ? 'title="比較は4モデルまで。どれかを外すと選べます"' : ""}><input type="checkbox" data-pick="${esc(m.id)}"${on ? " checked" : ""}${dis ? " disabled" : ""}>${mName(m)}${on ? `<span class="slotn" style="background:${color(m)}">${slot.get(m)}</span>` : "<span></span>"}</label>`; }).join("");
  // 1行＝1項目：位置レーン（灰＝その他の表示中モデル、番号＝選択モデル）＋選択モデルの値（★＝選択中の最高）
  const marks = mt => sel.filter(m => isNum(mt.get(m))).map(m => ({ m, t: slot.get(m) }));
  const row = (label, mt, opt = {}) => {
    const vals = sel.map(m => mt.get(m)), n = vals.filter(isNum);
    const b = mt.higher == null || n.length < 2 ? null : mt.higher ? Math.max(...n) : Math.min(...n);
    const r = mt.higher == null ? [] : ranked(mt, ms);
    return `<tr><td class="t2">${opt.gb ? `<span class="bn" data-gb="${esc(opt.gb)}" title="${esc(mt.name)}（クリックで解説へ）" style="cursor:pointer">${esc(label)}</span>` : esc(label)}</td>
      <td>${r.length ? lane(r, mt, { marks: marks(mt) }) : ""}</td>${vals.map(x => `<td class="r num${b != null && x === b ? " best" : ""}${x == null ? " na" : ""}">${esc(x == null ? "—" : mt.fmt(x))}</td>`).join("")}</tr>`;
  };
  const priceMt = (k, name) => ({ name, unit: "$/1M", higher: false, get: m => m.price?.[k] ?? null, fmt: fmt.usd });
  const benches = D.benchmarks.filter(b => sel.some(m => score(m, b.id) != null));
  // 各モデルが「選択中で最高」を取った項目数（ベンチのみ・2モデル以上に値がある項目）
  const wins = new Map(sel.map(m => [m, 0])); let nW = 0;
  benches.forEach(b => { const r = ranked(metric("bench:" + b.id), sel); if (r.length >= 2) { nW++; r.filter(x => x.v === r[0].v).forEach(x => wins.set(x.m, wins.get(x.m) + 1)); } });
  const winRow = `<tr class="wins"><td class="t2" style="font-weight:600">最高を取った項目数</td><td class="muted" style="font-size:11px">ベンチ ${nW} 項目のうち（2モデル以上に値がある項目）</td>${sel.map(m => `<td class="r"><div class="wb"><i style="width:${nW ? wins.get(m) / nW * 100 : 0}%;background:${color(m)}"></i></div><b class="num">${wins.get(m)}</b><span class="muted">/${nW}</span></td>`).join("")}</tr>`;
  const head = `<thead><tr><th>項目</th><th>全 ${ms.length} モデル中の位置（右ほど大・灰＝他）</th>${sel.map(m => `<th class="r" data-m="${esc(m.id)}" style="cursor:pointer"><span class="slotn" style="background:${color(m)}">${slot.get(m)}</span><span class="cn" title="${esc(m.name)}">${esc(m.name)}</span></th>`).join("")}</tr></thead>`;
  const tbl = sel.length ? `<div id="cmpWrap" style="position:absolute;inset:0;overflow:hidden"><table class="tbl fit cmp" style="table-layout:fixed"><colgroup><col style="width:15%"><col style="width:${sel.length > 2 ? 33 : 45}%">${sel.map(() => "<col>").join("")}</colgroup>${head}<tbody>
    ${winRow}
    <tr class="grp"><td colspan="${sel.length + 2}">仕様・価格（★＝選択中で最良：価格は安いほど良い）</td></tr>
    ${row("発表日", { name: "発表日", get: m => m.released, fmt: fmt.date })}
    ${row("入力 $/1M", priceMt("input", "入力単価"))}
    ${row("出力 $/1M", priceMt("output", "出力単価"))}
    ${row("出力速度", metric("spec:speed"))}
    ${row("コンテキスト", metric("spec:context"))}
    <tr class="grp"><td colspan="${sel.length + 2}">ベンチマーク（★＝選択中の最高・名前で解説へ）</td></tr>
    ${benches.map(b => row(b.short || b.label, metric("bench:" + b.id), { gb: b.id })).join("")}</tbody></table></div>` : `<div class="empty">左のリストからモデルを選んでください</div>`;
  v.innerHTML = card("モデルを選択", `${sel.length}/4 選択中`, `<div class="pick">${picker}</div>`)
    + card("項目ごとの比較", "—＝未公表", tbl);
  // 選択リストは件数に応じて行を詰め、スクロールさせない
  const pk = v.querySelector(".pick"), labs = pk.querySelectorAll("label");
  if (pk.scrollHeight > pk.clientHeight) labs.forEach(l => { l.style.padding = "1px 6px"; l.style.fontSize = "11.5px"; l.style.minHeight = Math.max(18, (pk.clientHeight - 4) / labs.length - 2) + "px"; });
  const cw = $("#cmpWrap"); if (cw) { const th = cw.querySelector("thead").offsetHeight, ng = cw.querySelectorAll("tbody tr.grp").length; cw.style.setProperty("--rh", clamp((cw.clientHeight - th - ng * 24 - 6) / Math.max(1, cw.querySelectorAll("tbody tr:not(.grp)").length), 20, 44) + "px"); }
  // 列見出しは1行に統一：入らない名前はブランド名を省いた型番（例 Claude Opus 5.5 → Opus 5.5）。提供元は色の番号で分かる
  v.querySelectorAll(".cmp thead .cn").forEach(c => { const th = c.closest("th"); if (th.scrollWidth > th.clientWidth + 1) { const t = c.textContent.replace(/^\S+\s+(?=[A-Za-z])/, ""); c.textContent = t; } if (th.scrollWidth > th.clientWidth + 1) th.style.fontSize = "10.5px"; });
  fixLanes(v);
  v.querySelectorAll("[data-pick]").forEach(cb => cb.onchange = () => {
    const id = cb.dataset.pick; S.compare = cb.checked ? [...S.compare.filter(x => sel.some(m => m.id === x)), id].slice(0, 4) : S.compare.filter(x => x !== id);
    store.set("compare", S.compare); render();
  });
}

function renderTable(v, nb = 8) {

    { k: "speed", l: "速度", get: m => m.speed, cell: m => esc(fmt.num(m.speed, 0)), num: true, hi: true, bar: true, log: true },
    ...benchCols.map(b => ({ k: b.id, l: b.short || b.label, title: b.label, get: m => score(m, b.id), cell: m => esc(score(m, b.id) == null ? "—" : fmt.unit(score(m, b.id), b.unit)), num: true, hi: b.higherIsBetter !== false, lo: b.higherIsBetter === false, bar: true })),
    { k: "open", l: "重みの公開", get: m => ow[m.openWeights] || "—", cell: m => openBadge(m) },
  ];

  const ext = Object.fromEntries(cols.filter(c => c.hi || c.lo).map(c => { const vs = ms.map(c.get).filter(isNum); return [c.k, { mx: Math.max(...vs), mn: Math.min(...vs), b: c.hi ? Math.max(...vs) : Math.min(...vs) }]; }));

/* ---------- 共通：相対位置（順位ベース。データのある範囲で算出し、推測補完はしない） ---------- */
function rankOf(b, m, ms) {

  if (!isNum(v) || vs.length < 2) return null;
  const hi = b.higherIsBetter !== false, rank = 1 + vs.filter(x => hi ? x > v : x < v).length;
  return { rank, n: vs.length, p: 1 - (rank - 1) / (vs.length - 1) };
}
function catStrength(m, ms) {
  return Object.fromEntries(S.D.cats.map(c => {
    const rs = S.D.benchmarks.filter(b => (b.category || "other") === c.id).map(b => rankOf(b, m, ms)).filter(Boolean);
    return [c.id, rs.length ? { p: rs.reduce((a, r) => a + r.p, 0) / rs.length, n: rs.length } : null];
  }));
}
const ARROW = '<span class="ar" aria-hidden="true"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 1.5L7 5l-4 3.5"/></svg></span>';

function flowHtml(steps, vertical) { return `<div class="flow${vertical ? " v" : ""}">${steps.map((t, i) => `<div class="st"><b>STEP ${i + 1}</b>${esc(t)}</div>`).join(ARROW)}</div>`; }
/** 構成の帯グラフ。系列色（提供元）と混同しないよう無彩色の段階で塗り、直接ラベルを付ける */
/** 「どんな課題か」：「A、B、C … のn評価」のような列挙はチップの並びで見せ、残りの説明は1行に（文章の羅列を避ける） */

function compHtml(c) {

const abMark = lv => lv === 2 ? '<span class="ab p" title="主に測る"></span>' : lv === 1 ? '<span class="ab s" title="一部測る"></span>' : '<span class="ab n" title="対象外"></span>';

/** 横並びの帯（ストリップ）：全モデルを点で並べ、選択モデルを強調。仕様上の「立ち位置」を一目で示す */
Chart.strips = function (host, specs, sel, ms) {
  const { W, H } = this.size(host), L = 92, R = 16, n = specs.length, rowH = Math.min(64, H / n);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="仕様の相対位置">`;
  specs.forEach((sp, i) => {
    const y = i * rowH + rowH * 0.48, all = ms.map(m => ({ m, v: sp.get(m) })).filter(r => isNum(r.v) && r.v > 0);
    s += `<text class="lb2" x="0" y="${y + 4}">${esc(sp.label)}</text>`;
    if (all.length < 2) { s += `<text class="ax" x="${L}" y="${y + 4}">データ不足</text>`; return; }

    const X = v => L + T(v) * (W - L - R);
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border-strong)" stroke-width="3" stroke-linecap="round"/>
      <text class="ax" x="${L}" y="${y + 17}">${esc(sp.fmt(mn))}${sp.lo ? " " + esc(sp.lo) : ""}</text><text class="ax" x="${W - R}" y="${y + 17}" text-anchor="end">${sp.hi ? esc(sp.hi) + " " : ""}${esc(sp.fmt(mx))}</text>`;
    all.filter(r => r.m !== sel).forEach(r => { s += `<g data-t="${Tip.add(tipModel(r.m, sp.label, sp.fmt(r.v)))}" data-m="${esc(r.m.id)}"><circle class="hit" cx="${X(r.v)}" cy="${y}" r="7"/><circle cx="${X(r.v)}" cy="${y}" r="3.5" fill="var(--muted)" opacity=".75"/></g>`; });
    const me = all.find(r => r.m === sel);

      const rank = 1 + vs.filter(v => sp.lowerBetter ? v < me.v : v > me.v).length, x = X(me.v), lbl = `${sp.fmt(me.v)}（${rank}/${vs.length}位）`, w = measure(lbl, 11, 600);
      s += `<g data-t="${Tip.add(tipModel(sel, sp.label, sp.fmt(me.v), { rank: `${rank}位 / ${vs.length}` }))}"><circle cx="${x}" cy="${y}" r="7" fill="${color(sel)}" stroke="var(--surface)" stroke-width="2"/>

/** ベンチマーク地図：横＝首位スコア（飽和度）、縦＝上位と下位の差（識別力） */

  }).join("");

  v.innerHTML = card("各ベンチマークが測る能力", "行クリックで個別解説", `<div id="abWrap" style="position:absolute;inset:0;overflow:hidden"><table class="tbl fit">${head}<tbody>${body}</tbody></table></div>`,
