    + card("規模（問題・タスク数）", "対数目盛。少数でも長時間の課題ほど1件の重みが大きい", host("ch-size"));
  const w = $("#abWrap"); w.style.setProperty("--rh", clamp((w.clientHeight - 40 - 24 * D.cats.length) / Math.max(1, D.benchmarks.length), 24, 54) + "px");
  const pts = D.benchmarks.filter(b => b.unit === "%").map(b => { const vs = ms.map(m => score(m, b.id)).filter(isNum); return vs.length >= 3 ? { b, x: Math.max(...vs), y: Math.max(...vs) - Math.min(...vs), n: vs.length } : null; }).filter(Boolean);
  Chart.benchMap($("#ch-bmap"), pts);
  Chart.lollipop($("#ch-size"), D.benchmarks.filter(b => isNum(b.tasks)).map(b => ({ id: b.id, label: b.short || b.label, v: b.tasks, text: b.size })).sort((a, b) => b.v - a.v), { title: "規模" });
}

function renderGuideDetail(v, ms) {

  if (!D.bm.has(S.guideBench)) S.guideBench = D.benchmarks[0]?.id;

  v.style.gridTemplateRows = "minmax(0,1fr)";
  const list = D.cats.map(c => `<div class="li-g">${esc(c.label)}</div>` + D.benchmarks.filter(x => (x.category || "other") === c.id).map(x =>
    `<button class="li" data-gb="${esc(x.id)}" aria-current="${x.id === b.id}"><span>${esc(x.short || x.label)}</span><span class="muted" style="font-size:11px">${KIND_GLYPH[x.kind] || ""}</span></button>`).join("")).join("");
  const src = D.src.get(b.src), url = safeUrl(src?.url);

  // 関連するベンチ：主に測る能力が重なる指標（重なりの大きい順）。位置レーンと上位3で「どこで差がつくか」を続けて見せる
  const rel = relatedBenches(b, ms);
  const center = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:12px"><div class="stack" style="flex:none">
      <p class="lead-q">${esc(b.desc || "")}</p>
      <dl class="kv" style="grid-template-columns:repeat(${Math.min(4, kv.length)},minmax(0,1fr))">${kv.map(([k, x]) => `<div><dt>${esc(k)}</dt><dd style="font-weight:600;font-size:12px">${esc(x)}</dd></div>`).join("")}</dl>
      ${b.format ? `<div><div class="sec-h">どんな課題か</div>${formatHtml(b)}</div>` : ""}
      ${b.flow ? `<div><div class="sec-h">評価の流れ</div>${flowHtml(b.flow)}</div>` : ""}
      ${b.composition ? `<div>${compHtml(b.composition)}</div>` : ""}
      ${b.scoring && !(b.composition && /重み/.test(b.scoring)) ? `<div><div class="sec-h">採点方法</div><p class="txt">${esc(b.scoring)}</p></div>` : ""}
      ${b.why ? `<div><div class="sec-h">結果の読み方</div><div class="note">${esc(b.why)}</div></div>` : ""}
      ${b.caveat ? `<div class="caveat" style="margin:0"><span>${esc(b.caveat)}</span></div>` : ""}
      ${src ? `<div class="muted" style="font-size:11px">出典：${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(src.label)}</a>` : esc(src.label)}</div>` : ""}
    </div>${rel.length ? `<div class="sec-h" style="margin:0;flex:none">同じ能力を測る関連ベンチ（点の位置＝スコア・番号＝順位）</div><div style="flex:1;min-height:0;position:relative" id="relBox">${podiumTable(podiumRows(rel, ms), "guideRel")}</div>` : ""}</div>`;
  const abil = `<div class="abchips">${D.abilities.map(a => { const lv = b.abilities?.[a.id] || 0; return `<span class="abc l${lv}" title="${esc(a.label)}：${esc(a.desc)}（${lv === 2 ? "主に測る" : lv === 1 ? "一部測る" : "対象外"}）">${abMark(lv)}${esc(a.label)}</span>`; }).join("")}</div>`;
  v.innerHTML = card("ベンチマーク", `${D.benchmarks.length}件`, `<div class="list">${list}</div>`)

      ${card("測る能力", `<span class="legend" style="display:inline-flex"><span>${abMark(2)}主に</span><span>${abMark(1)}一部</span></span>`, abil, { style: "flex:none" })}</div>`;

  Chart.hbar($("#ch-gd"), r.map(x => ({ ...x, src: x.m.scores[b.id]?.src, note: x.m.scores[b.id]?.note })), { title: b.label, fmt: mt.fmt, max: b.max, zeroBased: b.zeroBased, refs: b.refs, maxRow: 46, median: true,
    emptyMsg: "表示中のモデルにこのベンチのデータがありません", tick: t => b.unit === "%" ? t + "%" : fmt.num(t, 0) });
}

function renderModels(v) {
  const D = S.D, ms = visible(), sub = S.sub.models || "matrix";
  if (sub === "profile") return renderProfile(v, ms);
  v.style.gridTemplateColumns = "minmax(0,1fr)"; v.style.gridTemplateRows = "minmax(0,1fr)";
  const order = [...ms].sort((a, b) => (score(b, "aa_index") ?? -1) - (score(a, "aa_index") ?? -1) || (a.blended ?? 99) - (b.blended ?? 99));
  const prices = ms.map(m => m.blended).filter(x => x > 0), pmn = Math.min(...prices), pmx = Math.max(...prices);
  const priceCell = m => { if (!(m.blended > 0)) return `<td class="na">—</td>`; const t = (Math.log10(m.blended) - Math.log10(pmn)) / (Math.log10(pmx) - Math.log10(pmn) || 1);
    return `<td><span style="display:inline-flex;align-items:center;gap:8px"><svg width="70" height="12" aria-hidden="true"><line x1="4" x2="66" y1="6" y2="6" stroke="var(--border-strong)" stroke-width="3" stroke-linecap="round"/><circle cx="${4 + t * 62}" cy="6" r="4.5" fill="${color(m)}"/></svg><span class="num">${esc(fmt.usd(m.blended))}</span></span></td>`; };
  const ext = Object.fromEntries(["speed", "context"].map(k => { const vs = ms.map(m => m[k]).filter(x => x > 0); return [k, { mn: Math.min(...vs), mx: Math.max(...vs) }]; }));
  const barCell = (val, e, f) => isNum(val) ? `<td class="r num" style="${barBg(barT(val, e, true))}">${esc(f(val))}</td>` : `<td class="r na">—</td>`;
  const rows = order.map(m => { const cs = catStrength(m, ms);
    return `<tr data-prof="${esc(m.id)}" data-t="${Tip.add(tipModel(m, m.tier, null, { rank: m.summary }))}"><td><span class="mname"><span class="sw" style="background:${color(m)}"></span><span style="font-weight:600">${esc(m.name)}</span>${m.access === "limited" ? LIM : ""}${m.legacy ? '<span class="muted" style="font-size:10.5px">旧</span>' : ""}</span></td>
      <td class="sum">${esc(m.summary || "")}</td>
      ${D.cats.map(c => { const x = cs[c.id]; return x ? `<td class="cat" style="${seqStyle(x.p)}" data-t="${Tip.add(tipModel(m, c.label, String(Math.round(x.p * 100)), { rank: `${x.n}指標の順位から算出（100＝首位・0＝最下位）`, note: x.n === 1 ? "1指標のみのため参考値" : null }))}">${x.p >= 1 && x.n ? "首位" : x.p <= 0 ? "最下位" : Math.round(x.p * 100)}</td>` : `<td class="cat na">—</td>`; }).join("")}
      ${priceCell(m)}
      ${barCell(m.speed, ext.speed, v => fmt.num(v, 0))}${barCell(m.context, ext.context, fmt.tok)}<td>${openBadge(m)}</td></tr>`; }).join("");
  const legend = `<span class="legend"><span>数値＝カテゴリ内の相対位置（100＝首位・0＝最下位）</span><span style="width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,${seqBg(12)},${seqBg(SEQ_MAX)})"></span></span>`;
  v.innerHTML = card("モデル特徴の早見表", "行クリックでプロフィール・AA指数順", `<div id="matWrap" style="position:absolute;inset:0;overflow:hidden"><table class="tbl mat fit${order.length > 18 ? " dense" : ""}"><thead><tr><th>モデル</th><th>ひとことで言うと</th>${D.cats.map(c => `<th style="text-align:center;width:76px;white-space:nowrap" title="${esc(c.label)}：${esc(c.desc || "")}">${esc(c.short || c.label)}</th>`).join("")}<th style="width:150px;white-space:nowrap" title="入力3:出力1の混合単価。左ほど安い（対数）">混合単価（左＝安い）</th><th class="r" style="width:80px">速度 tok/s</th><th class="r" style="width:70px">文脈</th><th style="width:66px">重み</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    { right: legend, foot: `<div class="caveat"><span>相対位置は、表示中のモデルのうちデータのあるものの順位から算出（カテゴリ内の各ベンチの平均）。データがない場合は「—」とし、推測で補完していません。</span></div>` });
  fitRows($("#matWrap"), 16, 52, moreModels);
}

function renderProfile(v, ms) {
  const D = S.D;
  if (!ms.some(m => m.id === S.profile)) S.profile = ([...ms].sort((a, b) => (score(b, "aa_index") ?? -1) - (score(a, "aa_index") ?? -1))[0] || {}).id;
  const m = ms.find(x => x.id === S.profile);
  v.style.gridTemplateColumns = "236px minmax(0,1.25fr) minmax(0,1fr)";
  v.style.gridTemplateRows = "minmax(0,1fr)";
  // 近い選択肢：総合指数と価格（対数）の距離が近いモデル（「次に何と比べるか」を先回りして示す）
  const aaOf = x => score(x, "aa_index"), near = isNum(aaOf(m)) && m.blended > 0 ? ms.filter(x => x !== m && isNum(aaOf(x)) && x.blended > 0)
    .map(x => ({ x, d: Math.abs(aaOf(x) - aaOf(m)) / 8 + Math.abs(Math.log10(x.blended / m.blended)) })).sort((a, c) => a.d - c.d).slice(0, 6) : [];
  const nearHtml = near.length ? `<div class="stack" style="gap:6px">${near.map(({ x }) => `<div class="near">${mName(x)}<span class="muted num">AA ${fmt.num(aaOf(x), 0)}${aaOf(x) > aaOf(m) ? "↑" : aaOf(x) < aaOf(m) ? "↓" : ""}・${fmt.usd(x.blended)}${x.blended > m.blended ? "↑" : x.blended < m.blended ? "↓" : ""}</span><button class="go" data-cmp="${esc(m.id)},${esc(x.id)}">比較</button></div>`).join("")}</div>` : "";
  const sig = x => { const cs = catStrength(x, ms); return `<span class="sig" title="カテゴリ別の相対位置">${D.cats.map(c => cs[c.id] ? `<i style="height:${3 + cs[c.id].p * 11}px" title="${esc(c.short || c.label)} ${Math.round(cs[c.id].p * 100)}"></i>` : `<i class="na" style="height:3px"></i>`).join("")}</span>`; };
  const grpOn = ms.length <= 14;
  const list = D.providers.filter(p => ms.some(x => x.provider === p.id)).map(p => (grpOn ? `<div class="li-g">${esc(p.label)}</div>` : "") + ms.filter(x => x.provider === p.id).map(x =>
    `<button class="li" data-prof="${esc(x.id)}" aria-current="${x.id === m.id}"><span><span class="sw" style="background:${color(x)}"></span>${esc(x.name)}</span>${sig(x)}</button>`).join("")).join("");
  const ow = { yes: "オープンウェイト", partial: "重み一部公開", no: "クローズド" }[m.openWeights] || "";
  // 全ベンチでの位置：行＝このモデルに値があるベンチ、レーン＝表示中モデル中の位置（このモデルだけ色と順位）
  const rk = D.benchmarks.map(b => { const mt = metric("bench:" + b.id), r = ranked(mt, ms), i = r.findIndex(x => x.m === m); return i < 0 ? null : { b, mt, r, i }; }).filter(Boolean);
  const rkRows = rk.map(({ b, mt, r, i }) => `<tr><td><span class="bn" data-gb="${esc(b.id)}" title="${esc(b.label)}の解説へ" style="cursor:pointer">${esc(b.short || b.label)}</span></td><td>${lane(r, mt, { marks: [{ m, t: i + 1 }] })}</td><td class="r num">${esc(mt.fmt(r[i].v))}</td><td class="r"><b class="num">${i + 1}位</b><span class="muted">/${r.length}</span></td></tr>`).join("");
  const center = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">${[m.tier, m.access === "limited" ? "限定提供" : null, ow, m.released ? "発表 " + fmt.date(m.released) : null, m.legacy ? "旧世代" : null, m.license].filter(Boolean).map(t => `<span class="kb">${esc(t)}</span>`).join("")}</div>
    <p class="lead-q">${esc(m.summary || m.notes || "")}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div><div class="sec-h">強み</div><ul class="pros">${(m.strengths || []).map(t => `<li>${esc(t)}</li>`).join("") || '<li class="muted">未登録</li>'}</ul></div>
      <div><div class="sec-h">注意点</div><ul class="pros cons">${(m.cautions || []).map(t => `<li>${esc(t)}</li>`).join("") || '<li class="muted">未登録</li>'}</ul></div>
    </div>
    ${m.bestFor?.length ? `<div><div class="sec-h">向いている用途</div><div class="tags">${m.bestFor.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>` : ""}
    <div class="row"><button class="btn" id="pCmp">比較に追加</button><button class="btn" id="pAll">全ベンチ値と出典</button></div>
    <div class="sec-h" style="margin:0">全ベンチマークでの位置（色の点＝このモデル・番号＝順位・灰＝その他）</div>
    <div style="flex:1;min-height:0;position:relative">${rk.length ? `<div style="position:absolute;inset:0;overflow:hidden" id="profRanks"><table class="tbl" style="table-layout:fixed"><colgroup><col style="width:22%"><col><col style="width:13%"><col style="width:13%"></colgroup><tbody>${rkRows}</tbody></table></div>` : '<div class="muted" style="font-size:12px">公表済みのベンチマーク値はありません</div>'}</div>
  </div>`;
  const cs = catStrength(m, ms);
  const bars = `<div class="stack" style="gap:9px">${D.cats.map(c => { const x = cs[c.id];
    return `<div data-t="${Tip.add(`<div class="tt">${esc(c.label)}</div><div class="tm">${esc(c.desc || "")}</div>${x ? `<div class="tv">${Math.round(x.p * 100)}</div><div class="tm">${x.n}指標の順位から算出（100＝首位）</div>` : '<div class="tm">データなし</div>'}`)}">
      <div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(c.label)}</span><span class="${x ? "num" : "muted"}" style="${x ? "font-weight:650" : ""}">${x ? Math.round(x.p * 100) : "データなし"}${x ? `<span class="muted" style="font-weight:400;font-size:11px"> （${x.n}指標）</span>` : ""}</span></div>
      <div class="mini" style="height:8px;border-radius:4px;margin-top:4px"><i style="width:${x ? Math.max(2, x.p * 100) : 0}%;background:${color(m)};border-radius:4px"></i></div></div>`; }).join("")}</div>`;
  v.innerHTML = card("モデル", `${ms.length}件・棒＝分野別の強さ`, `<div class="list" id="pList">${list}</div>`)
    + card(`<span class="sw" style="display:inline-block;width:11px;height:11px;margin-right:7px;background:${color(m)}"></span>${esc(m.name)}`, esc(m.prov.label), center)
    + `<div style="display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;min-height:0">${card("カテゴリ別の強さ", "表示中モデル内の相対位置", bars, { style: "flex:none" })}
      ${card("仕様の立ち位置", "灰色＝他モデル・色＝このモデル", `<div style="position:relative;height:250px">${host("ch-strip")}</div>`, { style: "flex:none" })}${nearHtml ? card("近い選択肢", "総合指数と価格が近い順（↑↓＝このモデル比）", `<div id="nearBox" style="position:absolute;inset:0;overflow:hidden">${nearHtml}</div>`) : ""}</div>`;
  Chart.strips($("#ch-strip"), [
    { label: "AA指数", get: x => score(x, "aa_index"), fmt: x => fmt.num(x, 0), lo: "", hi: "" },
    { label: "混合単価", get: x => x.blended, fmt: fmt.usd, log: true, lowerBetter: true, lo: "安い", hi: "高い" },
    { label: "出力速度", get: x => x.speed, fmt: x => fmt.num(x, 0) + " tok/s" },
    { label: "コンテキスト", get: x => x.context, fmt: fmt.tok, log: true },
  ], m, ms);
  fitRows($("#profRanks"), 18, 52); fixLanes(v);
  const nb = $("#nearBox"); if (nb) { const its = [...nb.querySelectorAll(".near")]; while (nb.scrollHeight > nb.clientHeight + 1 && its.length > 1) its.pop().remove(); const k = nb.querySelectorAll(".near").length; nb.firstElementChild.style.gap = clamp((nb.clientHeight - k * 18) / Math.max(1, k), 6, 16) + "px"; }
  v.querySelectorAll("[data-cmp]").forEach(btn => btn.onclick = () => compareWith(btn.dataset.cmp.split(",")).run());
  const pl = $("#pList"), nli = pl.querySelectorAll(".li").length, ng = pl.querySelectorAll(".li-g").length;
  pl.querySelectorAll(".li").forEach(el => el.style.minHeight = clamp((pl.clientHeight - ng * 24) / Math.max(1, nli) - 1, 19, 28) + "px");
  if (pl.scrollHeight > pl.clientHeight) pl.querySelectorAll(".li").forEach(el => { el.style.padding = "1px 8px"; el.style.fontSize = "11.5px"; });
  $("#pCmp").onclick = () => { S.compare = [...(S.compare || []).filter(x => x !== m.id), m.id].slice(-4); store.set("compare", S.compare); go("compare"); };
  $("#pAll").onclick = () => openDrawer(m.id);
}

/* ---------- 次世代・動向 ---------- */
const ym = s => { const [y, m] = s.split("-").map(Number); return Date.UTC(y, m - 1, 1); };
const ymd = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const CONF_STYLE = { official: "solid", report: "hatch", forecast: "outline" };
function confKey(id, provC = "var(--text-2)") {
  const st = CONF_STYLE[id];
  const fill = st === "solid" ? provC : st === "hatch" ? "url(#hatch-key)" : "none";
  return `<svg width="22" height="10" aria-hidden="true"><defs><pattern id="hatch-key" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="4" fill="${provC}"/></pattern></defs><rect x="1" y="1" width="20" height="8" rx="3" fill="${fill}" stroke="${provC}" stroke-width="1.5" ${st === "outline" ? 'stroke-dasharray="3 2"' : ""}/></svg>`;
}

/** 系譜：提供元ごとのレーンに、旧世代（中抜き）・現行（塗り）・今後の予定（期間バー＝確度を塗り方で表現）を並べる */
Chart.lineage = function (host, models, upcoming, asOf, selId) {
  const { W, H } = this.size(host), O = S.D.outlook;

/** 時間軸：split 以前を frac の幅に圧縮できる（疎な昔と密な最近を1枚に収める）。目盛りは密度に応じて月・四半期・年・10年を自動選択 */

  if (opt.series) lanes = [...lanes, { id: "__series", label: opt.series.label }];
  const L = clamp(Math.max(...lanes.map(l => measure(l.label, 11, 600))) + 14, 56, 110), R = 12, eraH = opt.eras ? 22 : 0, T = 4 + eraH, Bm = 20, laneH = (H - T - Bm) / lanes.length;

    const fill = win ? "url(#era-w)" : e.kind === "boom" ? "color-mix(in oklab,var(--seq-hi) 9%,transparent)" : "transparent";

    const lbl = [e.label, e.short, e.mini].find(t => t && measure(t, 10.5, 600) <= b - a - 6) || "";   // 入らなければ略称、それも無理なら書かない（帯のツールチップで読める）
    s += `${i ? "" : `<defs><pattern id="era-w" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="var(--axis)" opacity=".35"/></pattern></defs>`}<g data-t="${tip}"><rect x="${a}" y="${T}" width="${Math.max(1, b - a)}" height="${H - T - Bm}" fill="${fill}"/>
      <rect x="${a}" y="2" width="${Math.max(1, b - a - 1)}" height="${eraH - 6}" rx="3" fill="${win ? "var(--surface-2)" : "var(--surface-3)"}"/>${lbl ? `<text x="${a + 4}" y="${eraH - 8}" style="font-size:10.5px;font-weight:600;fill:${win ? "var(--muted)" : "var(--text-2)"}">${esc(lbl)}</text>` : ""}</g>`;

  if (sc.splitX != null) s += `<text class="ax" x="${sc.splitX}" y="${T + 10}" text-anchor="middle" style="fill:var(--text-2)">≈</text><text class="ax" x="${sc.splitX - 4}" y="${H - Bm - 4}" text-anchor="end">← 圧縮</text>`;
  const ax = asOf <= t1 ? X(asOf) : null;
  if (ax != null) s += `<text class="ax" x="${ax - 4}" y="${T + 10}" text-anchor="end" style="fill:var(--text);font-weight:600">今日</text>`;
  const todayBox = ax != null ? [{ x: ax - 34, y: T, w: 34, h: 13 }] : [];
  const placed = [...todayBox], leaders = [], leadDefs = [], labels = [...todayBox];   // 「今日」の文字もラベルの障害物に
  const offLine = (a, w) => [ax, sc.splitX].every(x => x == null || a > x + 2 || a + w < x - 2);
  lanes.forEach((ln, i) => {
    const y0 = T + i * laneH, cy = y0 + laneH / 2;
    if (ln.id === "__series") {
      const g = opt.series, ps = g.points.filter(p => yearT(p[1]) >= t0 && yearT(p[1]) <= t1), lv = ps.map(p => Math.log10(p[2])), lo = Math.min(...lv), hi = Math.max(...lv);
      const Y = v => y0 + laneH - 10 - (Math.log10(v) - lo) / (hi - lo || 1) * (laneH - 34);
      s += `<line class="gl" x1="0" x2="${W - R}" y1="${y0}" y2="${y0}"/><text class="lb2" x="0" y="${y0 + laneH / 2}" style="fill:var(--text);font-weight:600">${esc(ln.label)}</text><text class="ax" x="0" y="${y0 + laneH / 2 + 14}">${esc(g.sub || "対数")}</text>`;
      s += `<path d="${ps.map((p, k) => `${k ? "L" : "M"}${X(yearT(p[1])).toFixed(1)},${Y(p[2]).toFixed(1)}`).join("")}" fill="none" stroke="var(--seq-hi)" stroke-width="2"/>`;
      ps.forEach((p, k) => { const x = X(yearT(p[1])), y = Y(p[2]), tip = Tip.add(`<div class="tt">${esc(p[0])}</div><div class="tv">${esc(fmt.big(p[2], g.unit))} ${esc(g.unit || "")}</div><div class="tm">${Math.floor(p[1])}年</div>`);
        s += `<g data-t="${tip}"><circle class="hit" cx="${x}" cy="${y}" r="8"/><circle cx="${x}" cy="${y}" r="${k === ps.length - 1 ? 5 : 3.5}" fill="var(--seq-hi)" stroke="var(--surface)" stroke-width="1.5"/></g>`; });
      const f = ps[0], l = ps[ps.length - 1];

      if (f && l) s += `<text class="lb2" x="${X(yearT(f[1])) + 8}" y="${Math.min(Y(f[2]) + 16, y0 + laneH - 2)}">${esc(f[0])} ${esc(fmt.big(f[2], g.unit))}</text><text class="lb2" x="${X(yearT(l[1])) - 10}" y="${Y(l[2]) - 6}" text-anchor="end">${esc(l[0])} ${esc(fmt.big(l[2], g.unit))}</text>`;
      return;
    }
    s += `<text class="lb2" x="0" y="${cy + 4}" style="fill:var(--text);font-weight:600">${esc(ln.label)}</text>${i ? `<line class="gl" x1="0" x2="${W - R}" y1="${y0}" y2="${y0}"/>` : ""}<line x1="${L}" x2="${W - R}" y1="${cy}" y2="${cy}" stroke="var(--border-strong)"/>`;
    const evs = events.filter(e => e.lane === ln.id).sort((a, b) => a.t - b.t);
    evs.forEach(e => placed.push({ x: X(e.t) - 6, y: cy - 6, w: 12, h: 12 }));
    evs.forEach(e => {
      const x = X(e.t), w = measure(e.title, 11) + 4, h = 13, fut = e.t > asOf;
      // 候補：上下の段（中央・左端揃え・右端揃え）→ 左右。引き出し線は点から段まで縦に伸び、ラベルの中央または端に接する
      const rows = [1, 2, 3, 4, 5, 6].filter(k => 9 + k * (h + 2) <= laneH / 2 + 2);
      const cands = [...rows.flatMap(k => [-w / 2, -2, -w + 2].flatMap(dx => [[x + dx, cy - 7 - k * (h + 2)], [x + dx, cy + 9 + (k - 1) * (h + 2)]])), [x + 8, cy - h / 2], [x - 8 - w, cy - h / 2], [x + 2, cy - 7 - (h + 2)], [x - w - 2, cy + 9]]

      // 引き出し線の箱（縦：点→ラベルの段、横：ラベルの端まで）。線が他のラベルを貫かず、ラベルが他の線に乗らないよう費用に含める
      const lead = ([a, b]) => { const ly = b < cy ? b + h : b, inside = x >= a - 1 && x <= a + w + 1, ex = inside ? x : x < a ? a : a + w; return [{ x: x - 1, y: Math.min(cy, ly) + 6, w: 2, h: Math.max(0, Math.abs(ly - cy) - 6) }, ...(inside ? [] : [{ x: Math.min(x, ex), y: ly - 1, w: Math.abs(ex - x), h: 2 }])]; };
      const cost = c => { const [a, b] = c, box = { x: a, y: b, w, h }; return placed.reduce((acc, q) => acc + ov(box, q), 0) + leaders.reduce((acc, q) => acc + ov(box, q) * 50, 0) + lead(c).reduce((acc, L) => acc + labels.reduce((t, q) => t + ov(L, q) * 50, 0), 0); };
      const costL = ([a, b]) => placed.reduce((acc, q) => acc + ov({ x: a, y: b, w, h }, q), 0);   // ラベル同士・点との重なりだけ
      let pos = cands.find(c => cost(c) === 0 && offLine(c[0], w)) || cands.find(c => cost(c) === 0) || cands.filter(c => costL(c) === 0).sort((p, q) => cost(p) - cost(q))[0];
      if (!pos && !opt.hideOverlap) pos = cands.reduce((m, c) => cost(c) < cost(m) ? c : m, cands[0] || [x, cy - 9 - h]);
      if (pos) { placed.push({ x: pos[0], y: pos[1], w, h }); labels.push({ x: pos[0], y: pos[1], w, h }); leaders.push(...lead(pos)); }
      const tip = Tip.add(`<div class="tt">${esc(e.title)}</div><div class="tm">${esc(e.when || "")}${fut ? "（予定）" : ""}</div><div class="tm" style="margin-top:4px">${esc(e.detail || "")}</div>`);
      s += `<g data-t="${tip}"><circle class="hit" cx="${x}" cy="${cy}" r="9"/><circle cx="${x}" cy="${cy}" r="${opt.small ? 4 : 5.5}" fill="${fut ? "var(--surface)" : "var(--ink)"}" stroke="var(--ink)" stroke-width="2"/>
        ${pos ? (() => { // 引き出し線：点から縦にラベルの段まで伸ばし、ラベルの端（または中央）へ短く横に接続する
          const ly = pos[1] < cy ? pos[1] + h - 1 : pos[1] + 1, inside = x >= pos[0] - 1 && x <= pos[0] + w + 1, ex = inside ? x : x < pos[0] ? pos[0] : pos[0] + w;

  leadDefs.forEach(d => { const others = labels.filter(b => b !== d.own && !(b.x === d.own.x && b.y === d.own.y));
    s += vline(d.x, Math.min(d.cy, d.ly) + (d.ly < d.cy ? 0 : 5), Math.max(d.cy, d.ly) - (d.ly < d.cy ? 5 : 0), others, 'stroke="var(--text-2)" stroke-width="1.3"');
    if (!d.inside) s += `<path d="M${d.x},${d.ly}H${d.ex}" stroke="var(--text-2)" stroke-width="1.3"/>`; });

  if (sc.splitX != null) s += vline(sc.splitX, T + 14, H - Bm, labels, 'stroke="var(--text-2)" stroke-dasharray="2 3"');
  host.innerHTML = s + "</svg>";
};
const dateEvents = evs => evs.map(e => ({ ...e, t: ymd(e.date), when: fmt.date(e.date) }));

/** 年ごとの推移（散布＋折れ線、対数可、基準線つき） */
Chart.growth = function (host, g) {
  const pts = [...g.points].sort((a, b) => a[1] - b[1]);
  if (!pts.length) return this.empty(host);
  const { W, H } = this.size(host), L = 48, R = 14, T = 10, B = 22;
  const xs = pts.map(p => p[1]), ys = pts.map(p => p[2]).concat((g.refs || []).map(r => r.v));
  const x0 = Math.floor(Math.min(...xs)) - 0.3, x1 = Math.ceil(Math.max(...xs)) + 0.3;
  let y0, y1, Y;
  if (g.log) { y0 = Math.pow(10, Math.floor(Math.log10(Math.min(...ys)))); y1 = Math.pow(10, Math.ceil(Math.log10(Math.max(...ys)))); Y = v => T + (1 - (Math.log10(v) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0) || 1)) * (H - T - B); }
  else { y0 = 0; y1 = g.max ?? niceMax(Math.max(...ys)); Y = v => T + (1 - v / y1) * (H - T - B); }
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const yf = v => v === 0 ? "0" : g.unit === "$" ? fmt.usd(v) : g.log ? fmt.big(v, g.unit) : fmt.num(v, v < 1 ? 2 : 0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title)}">`;
  const yt = g.log ? (() => { const a = [], dec = Math.log10(y1) - Math.log10(y0), every = Math.max(1, Math.ceil(dec / Math.max(2, Math.floor((H - T - B) / 26)))); for (let e = Math.log10(y0); e <= Math.log10(y1) + 1e-9; e += every) a.push(Math.pow(10, e)); return a; })() : ticks(0, y1, 4);
  yt.forEach(t => { s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L - 5}" y="${Y(t) + 3.5}" text-anchor="end">${esc(yf(t))}</text>`; });
  const yrStep = Math.max(1, Math.ceil((x1 - x0) / Math.max(2, Math.floor((W - L - R) / 46))));
  for (let y = Math.ceil(x0); y <= x1; y += yrStep) s += `<text class="ax" x="${X(y)}" y="${H - 6}" text-anchor="middle">${y}</text><line class="gl" x1="${X(y)}" x2="${X(y)}" y1="${T}" y2="${H - B}"/>`;
  (g.refs || []).forEach(r => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="var(--text-2)" stroke-dasharray="4 3"/><text class="ax" x="${L + 4}" y="${Y(r.v) - 4}" style="fill:var(--text-2)">${esc(r.label)}</text>`; });
  // 系列（points の4番目）があれば系列ごとに線を分け、末尾に変化率を添える（別系列を1本の線でつながない）
  const keys = [...new Set(pts.map(p => p[3] || ""))], strokes = ["var(--seq-hi)", "var(--c4)", "var(--c2)"];
  keys.forEach((k, ki) => { const ps = pts.filter(p => (p[3] || "") === k), col = strokes[ki % strokes.length];
    s += `<path d="${ps.map((p, i) => `${i ? "L" : "M"}${X(p[1])},${Y(p[2])}`).join("")}" fill="none" stroke="${col}" stroke-width="2" opacity=".8"/>`;
    const tag = k && g.series?.[k]; if (tag) s += `<g transform="translate(${W - R - 4} ${T + 4 + ki * 17})"><line x1="-${measure(k + "：" + tag, 12, 700) + 26}" x2="-${measure(k + "：" + tag, 12, 700) + 8}" y1="6" y2="6" stroke="${col}" stroke-width="2.5"/><text class="halo" x="0" y="10" text-anchor="end" style="font-size:12px;font-weight:700;fill:var(--text)">${esc(k)}：${esc(tag)}</text></g>`; });
  const items = pts.map(p => ({ p: { name: p[0] }, cx: X(p[1]), cy: Y(p[2]), text: p[0], order: ["tl", "top", "left", "br", "bottom", "right", "bl", "tr"] }));
  // 基準線の文字と線そのもの（幅いっぱいの細い帯）を障害物にして、点ラベルが線に重ならないようにする
  const obstacles = (g.refs || []).flatMap(r => { const w = measure(r.label, 10.5) + 6; return [{ x: L + 2, y: Y(r.v) - 15, w, h: 13 }, { x: L, y: Y(r.v) - 2, w: W - L - R, h: 4 }]; });
  [...new Set(pts.map(p => p[3] || ""))].forEach(k => obstacles.push(...lineObstacles(pts.filter(p => (p[3] || "") === k).map(p => [X(p[1]), Y(p[2])]))));   // データの線
  Object.entries(g.series || {}).forEach(([k, tag], ki) => { const w = measure(k + "：" + tag, 12, 700) + 30; obstacles.push({ x: W - R - 4 - w, y: T + 2 + ki * 17, w, h: 16 }); });   // 系列の凡例
  placeLabels(items, { L, R: W - R, T: 0, B: H - B }, { obstacles, hide: true });
  pts.forEach((p, i) => {
    const tip = Tip.add(`<div class="tt">${esc(p[0])}</div><div class="tv">${esc(g.unit === "$" ? fmt.usd(p[2]) : p[2] >= 1e4 ? fmt.big(p[2], g.unit) : fmt.num(p[2]))}${g.unit && g.unit !== "$" ? " " + esc(g.unit) : ""}</div><div class="tm">${Math.floor(p[1])}年</div>`);
    s += `<g data-t="${tip}"><circle class="hit" cx="${X(p[1])}" cy="${Y(p[2])}" r="9"/><circle cx="${X(p[1])}" cy="${Y(p[2])}" r="${i === pts.length - 1 ? 6 : 4.5}" fill="${i === pts.length - 1 ? "var(--seq-hi)" : "var(--ink)"}" stroke="var(--surface)" stroke-width="1.5"/>${items[i].p._l ? `<text class="lb2" x="${items[i].p._l[0]}" y="${items[i].p._l[1] + 11}">${esc(p[0])}</text>` : ""}</g>`;
  });
  host.innerHTML = s + "</svg>";
};

/** 自己回帰型と拡散型の生成手順の図解（上下2段。同じ6トークンを何回で確定するかを比べる） */
function mechanismSvg(W, H) {
  const toks = ["def", "add", "(a,", "b):", "return", "a+b"], n = toks.length, lw = 46;
  const bw = Math.min(56, (W - lw - (n - 1) * 3) / n), gap = 3;
  const arRows = [1, 2, 3, null, 6], dfRows = [[0, 0, 0, 0, 0, 0], [1, 0, 1, 0, 1, 0], [1, 1, 1, 1, 1, 1]], dfNew = [[], [0, 2, 4], [1, 3, 5]];
  const headH = 18, rows = arRows.length + dfRows.length, rh = Math.min(24, (H - headH * 2 - 10) / rows), bh = Math.max(12, rh - 5);
  const fs = clamp(bw / 4.2, 10.5, 11.5);
  const row = (y, filled, label, hl) => `<text class="ax" x="0" y="${y + bh / 2 + 4}">${esc(label)}</text>` + toks.map((t, i) => { const on = filled[i], bx = lw + i * (bw + gap);
    return `<rect x="${bx}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${on ? (hl.includes(i) ? "var(--ink)" : "var(--surface-3)") : "none"}" stroke="${on ? "none" : "var(--border-strong)"}" ${on ? "" : 'stroke-dasharray="3 2"'}/>${on ? `<text x="${bx + bw / 2}" y="${y + bh / 2 + fs / 2.8}" text-anchor="middle" style="font:${fs}px Consolas,ui-monospace,monospace;fill:${hl.includes(i) ? "var(--ink-text)" : "var(--text)"}"${t.length * fs * 0.55 > bw - 4 ? ` textLength="${bw - 4}" lengthAdjust="spacingAndGlyphs"` : ""}>${esc(t)}</text>` : ""}`; }).join("");
  let y = 12, s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block" role="img" aria-label="生成方式の比較">`;
  s += `<text class="lb" x="0" y="${y}" style="font-weight:650">自己回帰型（現在の主流）</text><text class="ax" x="${W}" y="${y}" text-anchor="end">6トークン ＝ 6回</text>`; y += 6;
  arRows.forEach(k => { if (k == null) { s += `<text class="ax" x="${lw + 4}" y="${y + rh / 2 + 3}">…（1回に1トークンずつ）</text>`; y += rh; return; } s += row(y, toks.map((_, i) => i < k), `${k}回目`, [k - 1]); y += rh; });
  y += 8; s += `<line x1="0" x2="${W}" y1="${y - 4}" y2="${y - 4}" stroke="var(--border)"/>`; y += 10;
  s += `<text class="lb" x="0" y="${y}" style="font-weight:650">拡散型</text><text class="ax" x="${W}" y="${y}" text-anchor="end" style="fill:var(--text);font-weight:600">6トークン ＝ 3回（並列に推敲）</text>`; y += 6;
  dfRows.forEach((f, k) => { s += row(y, f.map(Boolean), `${k + 1}回目`, dfNew[k]); y += rh; });
  return s + "</svg>";
}

    + card("ブレイクスルーになるか", "", `<div class="tc" style="position:absolute;inset:0;gap:6px"><div class="impl" style="font-weight:600" title="${esc(df.verdict)}"><span>${esc(df.verdictShort || df.verdict)}</span></div>${df.checks ? `<div class="sec-h" style="margin:2px 0 0">到達状況</div><div class="checks">${df.checks.map(([t, st]) => `<div class="ck ${st}"><span class="ck-i">${st === "done" ? "✓" : st === "doing" ? "…" : "○"}</span>${esc(t)}<span class="ck-s">${st === "done" ? "達成" : st === "doing" ? "進行中" : "未達"}</span></div>`).join("")}</div>` : ""}<div class="sec-h" style="margin:2px 0 0">いま向いている使い方</div><div class="tags">${df.uses.map(u => `<span class="tag">${esc(u)}</span>`).join("")}</div><div style="flex:1"></div>${srcLinks(df.srcs)}</div>`);
  const mech = $("#mech"); mech.innerHTML = mechanismSvg(mech.clientWidth, mech.clientHeight);
  Chart.mini($("#ch-dspeed"), { type: "bars", title: "出力速度", unit: "tok/s", items: df.speed.items.map(([l, val, g]) => [l, val, null, g]) });
  Chart.mini($("#ch-dlat"), { type: "bars", title: df.latency.title, unit: "秒", items: df.latency.items });
  Chart.events($("#ch-dev"), dateEvents(df.events), df.lanes, { split: Date.UTC(2024, 6, 1), frac: 0.3, pad: 2, title: "拡散型LMの年表" });
  // 課題→対策は、幅が狭く収まらないときは上下2段（課題の下に対策）に切り替える
  const pf = v.querySelector(".pf"); if (pf && pf.scrollHeight > pf.clientHeight + 1) pf.classList.add("narrow");
  shed(v, [".tags .tag"]);
}

/** 歴史の数値カードに添える小さな図：時代の帯（冬＝斜線）／成長の推移（対数の折れ線）。幅は枠に追従（年の注記はHTML） */
function factViz(f, Hh) {
  const axis = (a, b) => `<div class="fv-a"><span>${a}</span><span>${b}</span></div>`;
  if (f.viz === "eras" || f.viz === "winters") {
    const t0 = Hh.eras[0].from, t1 = Hh.eras[Hh.eras.length - 1].to;
    return `<div class="fv"><div class="fv-e">${Hh.eras.map(e => { const w = e.kind === "winter", hl = f.viz === "winters" ? w : true;
      return `<i class="${w ? "w" : e.kind}" style="flex:${(e.to - e.from).toFixed(2)};opacity:${hl ? 1 : 0.25}" title="${esc(e.label)}（${e.from}〜${Math.floor(e.to)}）"></i>`; }).join("")}</div>${axis(t0, Math.floor(t1))}</div>`;
  }
  const g = f.viz?.startsWith("growth:") && Hh.growth.find(x => x.id === f.viz.slice(7)); if (!g) return "";
  const ps = g.points, xs = ps.map(p => p[1]), ys = ps.map(p => g.log ? Math.log10(p[2]) : p[2]), W = 100, H = 30;
  const X = v => (v - Math.min(...xs)) / (Math.max(...xs) - Math.min(...xs) || 1) * W, Y = v => 2 + (1 - (v - Math.min(...ys)) / (Math.max(...ys) - Math.min(...ys) || 1)) * (H - 4);
  const d = ps.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join("");
  return `<div class="fv"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--seq-hi)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>${axis(Math.floor(xs[0]), Math.floor(xs[xs.length - 1]))}</div>`;
}
function renderHistory(v) {
  const D = S.D, Hh = D.history, sub = S.sub.history || "timeline";
  if (!Hh) { v.innerHTML = `<div class="card"><div class="empty">歴史データがありません</div></div>`; return; }
  if (sub === "growth") {
    v.style.gridTemplateColumns = "repeat(3,minmax(0,1fr))"; v.style.gridTemplateRows = "repeat(2,minmax(0,1fr))";
    // 見出しの直後に要点（結論）を置き、注記は出典の行へ
    v.innerHTML = Hh.growth.map((g, i) => card(esc(g.title), g.log ? "対数目盛" : "", `<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:6px"><div class="impl" style="flex:none;font-weight:600"><span>${esc(g.note || "")}</span></div><div style="position:relative;flex:1;min-height:0">${host("ch-g" + i)}</div></div>`, { foot: srcLinks(g.srcs) })).join("");
    Hh.growth.forEach((g, i) => Chart.growth($("#ch-g" + i), g));
    return;
  }
  v.style.gridTemplateColumns = "minmax(0,1fr)"; v.style.gridTemplateRows = "auto minmax(0,1fr)";
  const facts = `<div class="kpis">${Hh.facts.map(f => `<div class="card kpi"><div class="k-row hist"><div><div class="k-v" style="margin:0"><b class="num">${esc(f.v)}</b></div><div class="k-d" style="white-space:normal">${esc(f.l)}</div></div>${factViz(f, Hh)}</div></div>`).join("")}</div>`;
  v.innerHTML = facts + card("AIの歴史年表（1943年〜）", "上段の帯＝時代（斜線＝冬の時代・カーソルで各時代の説明）。2010年より前は圧縮・2020年以降を拡大表示", host("ch-hist"), { foot: srcLinks(Hh.srcs) });
  const evs = Hh.milestones.map((m, i) => ({ id: "m" + i, t: yearT(m.y), title: m.t, detail: m.d, lane: m.lane, when: `${Math.floor(m.y)}年` }));
  Chart.events($("#ch-hist"), evs, Hh.lanes, { eras: Hh.eras, split: [Date.UTC(2010, 0, 1), Date.UTC(2020, 0, 1)], frac: [0.3, 0.58], from: Date.UTC(1940, 0, 1), to: Date.UTC(2027, 0, 1), hideOverlap: true, small: true, title: "AIの歴史年表",
    series: (g => g && { label: "学習計算量", sub: "FLOP・対数", unit: g.unit, points: g.points })(Hh.growth.find(g => g.id === "compute")) });
}

function srcLinks(ids) {
  const xs = (ids || []).map(id => S.D.src.get(id)).filter(Boolean);
  // 出典は先頭3件を短い名前で示し、残りは件数（全件はツールチップ）。行を増やさず省略記号も出さない
  const shown = xs.slice(0, 3), rest = xs.length - shown.length;
  return xs.length ? `<div class="srcs" title="${esc(xs.map(x => x.label).join(" / "))}">出典：${shown.map(x => { const u = safeUrl(x.url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(x.label.split(" – ")[0])}</a>` : esc(x.label.split(" – ")[0]); }).join("・")}${rest > 0 ? `<span> ほか${rest}件</span>` : ""}</div>` : "";
}
/** 数値カードの1項目：値・説明に加え、bar（同じカード内で比べる量）や cmp（2つ以上の値の比較棒）があれば図を添える */
function statHtml(x, bmax) {
  const tip = x.note ? ` data-t="${Tip.add(`<div class="tt">${esc(x.l)}</div><div class="tv">${esc(x.v)}</div><div class="tm">${esc(x.note)}</div>`)}"` : "";
  const cmx = x.cmp ? (x.max || Math.max(...x.cmp.map(c => c[1]))) : 0;
  const cmp = x.cmp ? `<span class="scmp">${x.cmp.map(([l, v, k]) => `<span class="sc-r"><span class="sc-l">${esc(l)}</span><i class="sbar"><i class="${k === "diff" ? "hatch" : k === "ar" ? "gray" : ""}" style="width:${(v / cmx * 100).toFixed(1)}%"></i></i><span class="num">${esc(fmt.num(v))}</span></span>`).join("")}</span>` : "";
  return `<div class="stat"${tip}><b>${esc(x.v)}</b><span>${esc(x.l)}${x.note ? ' <span class="info">i</span>' : ""}${x.bar && bmax ? `<i class="sbar"><i style="width:${Math.max(1.5, x.bar / bmax * 100).toFixed(1)}%"></i></i>` : ""}${cmp}</span></div>`;
}
/** 動向カード：見出し → 示唆（結論）→ 主要な数値 → 図 → 背景の説明 → 出典（結論→根拠→詳細）。
 *  横長の枠では「左＝文章と数値／右＝図」の2列にし、図に十分な面積を与える */
function trendCard(t, i, opt = {}) {
  // 数値に bar（比べられる量）があれば、同じカード内の最大値に対する長さの棒を添える（文字のKPIを図で比較）
  const bmax = Math.max(0, ...t.stats.map(x => x.bar || 0));
  const stats = `<div class="stats">${t.stats.map(x => statHtml(x, bmax)).join("")}</div>`;
  const chart = t.chart ? `<div class="sec-h" style="margin:2px 0 -4px">${esc(t.chart.title)}</div><div style="position:relative;flex:1;min-height:70px">${host("ch-tr-" + i)}</div>` : "";
  const text = `<div class="impl" style="font-weight:600;color:var(--text)"><span>${esc(t.implication)}</span></div>${stats}`, foot = `<p class="lead2">${esc(t.lead)}</p>${srcLinks(t.srcs)}`;
  const body = opt.wide && t.chart ? `<div class="tc wide" style="position:absolute;inset:0"><div class="tc tx">${text}${foot}</div><div class="tc">${chart}</div></div>`
    : `<div class="tc" style="position:absolute;inset:0">${text}${chart || '<div style="flex:1"></div>'}${foot}</div>`;
  return card(esc(t.title), "", body, { style: opt.style || "" });
}

function renderFuture(v) {
  const D = S.D, O = D.outlook, sub = S.sub.future || "roadmap";
  if (sub === "roadmap") return renderRoadmap(v);
  if (sub === "diffusion") return renderDiffusion(v);
  const ts = O.trends.filter(t => t.group === sub);
  if (sub === "safety") {
    v.style.gridTemplateColumns = `repeat(${Math.max(1, ts.length)},minmax(0,1fr))`;
    v.style.gridTemplateRows = "minmax(0,1fr) minmax(0,1.15fr)";
    v.innerHTML = card("安全・規制の年表", "●＝実施済み・○＝予定。項目にカーソルで詳細", host("ch-ev"), { style: `grid-column:1/-1` }) + ts.map((t, i) => trendCard(t, i, { wide: true })).join("");
    Chart.events($("#ch-ev"), dateEvents(O.events), O.lanes, { title: "安全・規制の年表" });
  } else {
    // 3件以上は2列に並べ（奇数なら最後を全幅）、各カードを「文章｜図」の横長レイアウトにする
    // 4件以上は2列の横長カード（左＝文章｜右＝図）、3件以下は縦長カードを横一列
    // この画面固有の実データ（収録モデルの発表日×指標）があれば下段に散布図で並べ、動向を手元のデータで確かめられるようにする
    const n = ts.length, wide = n >= 4, cols = wide ? 2 : Math.max(1, n), ms = visible();
    const mc = (O.groupModelCharts?.[sub] || []).filter(([spec]) => metric(spec));
    v.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
    v.style.gridTemplateRows = mc.length ? "minmax(0,1.25fr) minmax(0,1fr)" : `repeat(${Math.ceil(Math.max(1, n) / cols)},minmax(0,1fr))`;
    v.innerHTML = n ? ts.map((t, i) => trendCard(t, i, { wide })).join("")
      + (mc.length ? `<div style="grid-column:1/-1;display:grid;grid-template-columns:repeat(${mc.length},minmax(0,1fr));gap:12px;min-height:0">${mc.map(([spec, title, impl], i) => card(esc(title), "名前は各月の最大・最小", `<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:6px"><div class="impl" style="flex:none;font-weight:600"><span>${esc(impl)}</span></div><div style="position:relative;flex:1;min-height:0">${host("ch-mc" + i)}</div></div>`)).join("")}</div>` : "")
      : `<div class="card"><div class="empty">このカテゴリの動向データはまだありません</div></div>`;
    const yr = d => { const t = ymd(d), y = new Date(t).getUTCFullYear(); return y + (t - Date.UTC(y, 0, 1)) / (365.25 * 864e5); };
    mc.forEach(([spec, title], i) => { const mt = metric(spec), pts = ms.filter(m => m.released && isNum(mt.get(m))).map(m => ({ m, x: yr(m.released), y: mt.get(m) }));
      const lg = /^(price|spec)/.test(spec); pts.forEach(p => { p.yv = p.y; p.tip = `${fmt.date(p.m.released)}・${mt.fmt(p.yv)}`; if (lg) p.y = Math.log10(p.y); });
      // 名前を出すのは、各月の最大・最小と「その時点の首位」の点だけ（他は名前なしの点＝密集を避ける）
      const byMo = {}; pts.forEach(p => { const k = Math.floor(p.x * 12); (byMo[k] ||= []).push(p); }); Object.values(byMo).forEach(g => { g.sort((a, b) => a.y - b.y); g[0].key = g[g.length - 1].key = true; });
      Chart.scatter($("#ch-mc" + i), pts, { title, xFit: true, hideLabels: true, frontier: !lg, xTicks: (a, b) => { for (const st of [12, 6, 3, 2, 1]) { const out = []; for (let k = Math.ceil(a * 12 / st) * st; k <= b * 12 + 1e-6; k += st) out.push(k / 12); if (out.length >= 4 || st === 1) return out.length > 8 ? out.filter((_, i) => i % 2 === 0) : out; } }, xTick: t => { const k = Math.round(t * 12), y = Math.floor(k / 12), mo = k - y * 12 + 1; return `${y}/${String(mo).padStart(2, "0")}`; }, yTick: lg ? t => (spec.startsWith("price") ? fmt.usd : spec === "spec:context" ? fmt.tok : x => fmt.num(x, 0))(Math.pow(10, t)) : t => fmt.num(t, 0), xLabel: "発表日 →", yLabel: lg ? `${mt.name}（対数）` : "AA指数 ↑", labelIf: p => p.key || p.front, emptyMsg: "発表日と値のあるモデルが2つ以上必要です" }); });
  }
  // 枠に収まらない場合は背景説明（詳細）を省き、見出しのツールチップへ移す（結論と数値・図を優先）
  v.querySelectorAll(".tc.tx").forEach(tx => { if (tx.clientHeight - tx.scrollHeight > 0 || [...tx.children].reduce((a, c) => a + c.offsetHeight, 0) < tx.clientHeight - 120) tx.classList.add("roomy"); if (tx.scrollHeight > tx.clientHeight + 1) tx.classList.remove("roomy"); });
  shed(v, [".lead2", ".srcs"]);
  ts.forEach((t, i) => t.chart && Chart.mini($("#ch-tr-" + i), t.chart));
}

function renderRoadmap(v) {
  const D = S.D, O = D.outlook;
  const provOk = id => !S.f.off.has(id);
  const ms = D.models.filter(m => provOk(m.provider) && (!S.f.open || m.openWeights !== "no"));   // 系譜は旧世代も常に表示
  const ups = O.upcoming.filter(u => provOk(u.provider));
  if (!ups.some(u => u.id === S.upcoming)) S.upcoming = ups[0]?.id;
  const u = ups.find(x => x.id === S.upcoming);
  v.style.gridTemplateColumns = "minmax(0,2.3fr) minmax(0,1fr)";
  v.style.gridTemplateRows = "minmax(0,1fr)";
  const legend = `<span class="legend"><span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="var(--surface)" stroke="var(--text-2)" stroke-width="2"/></svg>旧世代</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="var(--text-2)"/></svg>現行</span>${O.confidence.map(c => `<span class="conf-key" title="${esc(c.desc)}">${confKey(c.id)}${esc(c.label)}</span>`).join("")}</span>`;
  const p = u && D.pv.get(u.provider), conf = u && O.confidence.find(c => c.id === u.conf);
  // 予定のミニ・ガント：同じ時間軸に各予定の期間を帯で並べ、確度を帯の塗り（塗り＝公式・斜線＝報道・破線＝予測）で示す
  const mi = ym => { const [y, m] = ym.split("-").map(Number); return y * 12 + m - 1; };
  const sorted = [...ups].sort((a, b) => a.window[0].localeCompare(b.window[0]) || a.window[1].localeCompare(b.window[1]));
  const g0 = Math.min(...ups.map(x => mi(x.window[0])), mi(D.meta.asOf.slice(0, 7))), g1 = Math.max(...ups.map(x => mi(x.window[1]))) + 1;
  const gx = k => ((k - g0) / Math.max(1, g1 - g0) * 100).toFixed(2) + "%";
  const bar = x => { const c = provColor(D.pv.get(x.provider)), st = CONF_STYLE[x.conf];
    return `<i class="gb ${st}" style="left:${gx(mi(x.window[0]))};width:calc(${gx(mi(x.window[1]) + 1)} - ${gx(mi(x.window[0]))});--c:${c}"></i>`; };
  const today = `<i class="gt" style="left:${gx(mi(D.meta.asOf.slice(0, 7)) + Number(D.meta.asOf.slice(8, 10)) / 31)}"></i>`;
  const yrs = []; for (let k = Math.ceil(g0 / 12) * 12; k < g1; k += 12) yrs.push(`<span style="left:${gx(k)}">${k / 12}</span>`);
  const others = `<div class="gantt"><div class="gh"><span></span><div class="gtrack gaxis">${yrs.join("")}<span class="gnow" style="left:${gx(mi(D.meta.asOf.slice(0, 7)))}">今日</span></div></div>${sorted.map(x => `<button class="li" data-up="${esc(x.id)}" aria-current="${x.id === u?.id}" title="${esc(x.name)}：${esc(x.window[0].replace("-", "/"))}〜${esc(x.window[1].replace("-", "/"))}"><span class="gn"><span class="sw" style="background:${provColor(D.pv.get(x.provider))}"></span>${esc(x.name)}</span><span class="gtrack">${today}${bar(x)}</span></button>`).join("")}</div>`;
  const detail = u ? `<div class="stack" id="upDetail" style="position:absolute;inset:0;overflow:hidden;gap:10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="kb"><span class="sw" style="background:${provColor(p)}"></span>${esc(p?.label || u.provider)}</span><span class="kb">${esc(O.statuses[u.status] || u.status)}</span><span class="kb" title="${esc(conf?.desc || "")}">${confKey(u.conf, provColor(p))}確度：${esc(conf?.label || "")}</span></div>
      <div><div class="sec-h">見通しの時期 <b class="num" style="color:var(--text)">${esc(u.window[0].replace("-", "/"))} 〜 ${esc(u.window[1].replace("-", "/"))}</b></div></div>
      <p class="txt" style="font-weight:600">${esc(u.summary)}</p>
      ${u.points?.length ? `<ul class="pros">${u.points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${srcLinks(u.srcs)}
      <div class="sec-h" style="margin-top:4px">すべての予定（時期順・クリックで切替）</div>${others}
    </div>` : `<div class="empty">表示中の提供元に予定はありません</div>`;
  v.innerHTML = card("モデルの系譜と今後の投入予定", "点＝発表済み・帯＝今後の見通し（クリックで詳細）", host("ch-lin"), { right: legend })
    + card(u ? esc(u.name) : "予定", "選択中の見通し", detail);
  // 右の一覧が収まらない場合は、選択中以外の行を末尾から省き件数を示す（スクロールさせない）
  const det = $("#upDetail"); if (det && det.scrollHeight > det.clientHeight + 1) {
    det.querySelector(".gantt").insertAdjacentHTML("beforeend", `<div class="muted" id="upMore" style="font-size:11px;padding:2px 6px">ほか 0 件</div>`);
    let cut = 0; for (const r of [...det.querySelectorAll(".gantt .li")].reverse()) { if (det.scrollHeight <= det.clientHeight + 1) break; if (r.getAttribute("aria-current") === "true") continue; r.remove(); cut++; }
    $("#upMore").textContent = `ほか ${cut} 件（左の図の帯をクリック）`; }
  Chart.lineage($("#ch-lin"), ms, ups, D.meta.asOf, u?.id);
  v.querySelectorAll("[data-up]").forEach(el => el.onclick = e => { e.stopPropagation(); S.upcoming = el.dataset.up; store.set("upcoming", S.upcoming); Tip.hide(); render(); });
}

/* ==================================================================
   6. Import / Export
   ================================================================== */
function download(text, name, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function ingest(json, mode, origin) {
  const next = mode === "replace" ? json : Data.merge(S.D.raw, json);
  const r = Data.validate(next);
  if (r.errors.length) { toast(`取り込み失敗：${r.errors[0]}${r.errors.length > 1 ? ` ほか${r.errors.length - 1}件` : ""}`); return false; }
  store.set("dataset", next); load(next, origin);
  toast(`取り込み完了（モデル ${next.models.length}件${r.warnings.length ? `・警告 ${r.warnings.length}件` : ""}）`);
  return true;
}
function readFile(f, mode) { const rd = new FileReader(); rd.onload = () => { try { ingest(JSON.parse(rd.result), mode, "local"); } catch (e) { toast("JSONの構文エラー：" + e.message); } }; rd.readAsText(f); }
async function fetchRemote(url, mode = "merge", silent = false) {
  try {
    const res = await fetch(url, { cache: "no-store" }); if (!res.ok) throw new Error("HTTP " + res.status);
    const ok = ingest(await res.json(), mode, "remote"); if (ok) store.set("lastFetch", Date.now());
  } catch (e) { if (!silent) toast("取得失敗：" + e.message + "（CORS設定を確認）"); else console.warn("auto fetch failed", e); }
}

   8. Boot
   ================================================================== */
function load(raw, origin) { S.D = Data.index(raw); S.source = origin; $("#brandSub").textContent = (raw.meta?.title || "主要モデルの性能・価格・速度"); render(); }
function boot() {
  Tip.el = $("#tip");
  let theme = store.get("theme", "auto"); applyTheme(theme);
  $("#themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(theme); render(); };
  readHash();
  const saved = store.get("dataset", null);
  const seed = Data.seed();
  // 保存データが埋め込みより古い場合は埋め込みを優先（HTML更新で最新化された場合に古いキャッシュへ戻らない）
  const useSaved = saved && Data.validate(saved).errors.length === 0 && (saved.meta?.asOf || "") >= (seed.meta?.asOf || "");
  load(useSaved ? saved : seed, useSaved ? "local" : "seed");
  const qp = new URLSearchParams(location.search).get("data");
  if (qp && safeUrl(qp)) fetchRemote(qp, "merge");
  else if (store.get("autoFetch", false) && safeUrl(store.get("remoteUrl", ""))) fetchRemote(store.get("remoteUrl"), "merge", true);

  // イベント委譲：ツールチップ & モデル詳細
  document.addEventListener("mousemove", e => { const t = e.target.closest?.("[data-t]"); t ? Tip.show(t.dataset.t, e.clientX, e.clientY, t) : Tip.hide(); });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-gb]"); if (g) { Tip.hide(); closeDrawer(); S.guideBench = g.dataset.gb; store.set("guideBench", S.guideBench); return go("guide", "detail"); }
    const pf = e.target.closest("[data-prof]"); if (pf) { Tip.hide(); closeDrawer(); S.profile = pf.dataset.prof; store.set("profile", S.profile); return go("models", "profile"); }
    if (e.target.closest("input,button,a,label.dis")) return;
    const m = e.target.closest("[data-m]"); if (m) { Tip.hide(); openDrawer(m.dataset.m); }
  });
  $("#scrim").onclick = closeDrawer;
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") return closeDrawer();
    if (e.target.matches("input,select,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
    const i = e.key === "0" ? 10 : +e.key; if (i >= 1 && i <= VIEWS.length) go(VIEWS[i - 1].id);
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(render, 120); }).observe($("#view"));
}
boot();
</script>
</body>
</html>
